← Précédent</button><span class="saved">● réponse enregistrée</span></footer></div><script>const V='UX4',K='qt_ux4';const Q=[
['Architecture','Quelle composition générale ressemble le plus au grand centre d’opérations que tu imagines ?','Choisis d’abord la forme du lieu, pas les détails.',[['Anneau autour d’un noyau','Les équipes entourent un centre très fort.','layout1'],['Salle circulaire','Un grand espace enveloppant et spectaculaire.','layout2'],['Nef architecturale','Grand volume profond avec axes visuels forts.','layout3'],['Pods reliés','Plusieurs îlots spécialisés autour du cœur.','layout4'],['Plateau en niveaux','Un centre d’opérations avec différentes hauteurs.','layout5']]],
['Caméra','Quel angle doit donner l’effet “wow” à l’ouverture ?','On calibre la hauteur et le caractère cinématique.',[['3/4 bas et proche','On sent les volumes et les personnages.','cam1'],['3/4 moyen','Équilibre entre spectacle et lisibilité.','cam2'],['Très haut','Vue claire de tout le système comme un jeu de gestion.','cam3'],['Angle ciné profond','Perspective marquée, architecture dominante.','cam4'],['Caméra orbitale vivante','Elle peut changer subtilement autour du centre.','cam5']]],
['Architecture','Quel langage architectural préfères-tu ?', 'La structure du bâtiment doit déjà donner le ton premium.',[['Lignes nettes et massives','Volumes rectilignes, précis, très maîtrisés.','layout3'],['Courbes et anneaux','Plus organique, fluide, futuriste sans cliché.','layout2'],['Industriel sophistiqué','Passerelles, niveaux, métal et profondeur.','layout5'],['Modules scientifiques','Pods et espaces spécialisés clairement dessinés.','layout4'],['Hybride monumental','Base très architecturale + zones plus organiques.','layout1']]],
['Noyau central','Quelle forme doit avoir l’icône du laboratoire ?', 'Elle peut devenir le point focal du monde 3D.',[['Réacteur / sphère','Objet physique lumineux, mystérieux et premium.','core1'],['Puits de données','Table basse circulaire, profondeur et information.','core2'],['Anneaux suspendus','Sculpture scientifique avec plusieurs orbites.','core3'],['Prisme holographique','Un objet plus digital et graphique.','core4'],['Colonne énergétique','Verticale, monumentale, visible de loin.','core5']]],
['Noyau central','Quelle importance visuelle doit prendre ce noyau ?', 'Même forme, mais pas le même impact sur la pièce.',[['Petit bijou','Point de détail, pas le centre absolu.','core5'],['Présent mais équilibré','On le remarque sans écraser le reste.','core2'],['Très central','Il structure tout l’espace autour de lui.','core3'],['Monumental','Il domine la composition dès l’ouverture.','core1'],['Variable avec l’activité','Discret au repos, spectaculaire quand factuellement actif.','core4']]],
['Workers','Quelle silhouette humaine colle le mieux ?', 'Toujours adulte, crédible et non enfantine.',[['Miniature premium','Stylisée, proportions humaines mais simplifiées.','human1'],['Semi-réaliste','Plus proche d’une vraie personne, détails visibles.','human2'],['Graphique adulte','Formes simplifiées, design très propre.','human3'],['Silhouette élégante','Peu de détails, posture et mouvement avant tout.','human4'],['Agent humanoïde','Un peu plus IA / robot mais encore expressif.','human5']]],
['Workers','Quelle proportion des personnages préfères-tu ?', 'C’est ce qui évite l’effet jouet.',[['Très réaliste','Tête petite, corps adulte, silhouette naturelle.','human2'],['Légèrement stylisée','Un peu plus lisible mais encore adulte.','human1'],['Stylisée nette','Proportions simplifiées façon jeu de gestion premium.','human3'],['Très fine','Silhouettes élancées et élégantes.','human4'],['Hybride humain/agent','Proportions humaines avec codes IA.','human5']]],
['Postes de travail','À quoi doivent ressembler les stations ?', 'Le mobilier raconte le sérieux du laboratoire.',[['Bureau premium physique','Bois sombre, écran, objets, vraies matières.','desk1'],['Console intégrée','Poste construit dans l’architecture.','desk2'],['Desk futuriste discret','Technologique mais pas science-fiction cheap.','desk3'],['Table ronde collaborative','Plus équipe et recherche partagée.','desk4'],['Multi-écrans sobres','Plus centre d’opérations mais très propre.','desk5']]],
['Écrans','Quelle présence doivent avoir les écrans ?', 'Ils ne doivent jamais inventer de résultats.',[['Peu nombreux','Des écrans seulement quand ils apportent quelque chose.','desk1'],['Intégrés au mobilier','Présents mais parfaitement absorbés dans le décor.','desk2'],['Technologiques','Écrans plus visibles, fins et premium.','desk3'],['Collaboratifs','Grandes surfaces communes plutôt que multiples écrans.','desk4'],['Centre d’opérations','Plusieurs écrans par poste, mais sans surcharge hacker.','desk5']]],
['Lumière','Quel contraste veux-tu réellement ?', 'On reste dans ton bleu nuit + ambre, mais il faut choisir l’intensité.',[['Nuit douce','Bleu profond, contraste modéré, très lisible.','light1'],['Ambre cinématique','Rayons chauds, contraste fort, très spectaculaire.','light2'],['Studio sombre premium','Très maîtrisé, chaque volume reste lisible.','light3'],['Nocturne chaleureux','Zones sombres + pools de lumière ambre.','light4'],['Très dramatique','Ombres profondes et sources lumineuses tranchées.','light5']]],
['Matières','Quelle famille de matières doit dominer ?', 'Le monde doit paraître coûteux et cohérent.',[['Bois foncé + métal','Chaleur adulte et centre d’opérations premium.','detail1'],['Pierre + métal brossé','Monumental, scientifique, institutionnel.','detail2'],['Verre fumé + acier','Technologique et sophistiqué.','detail3'],['Textile + minéral + métal','Riche, tactile, très design.','detail4'],['Mix architectural','Chaque zone a ses matières, palette parfaitement contrôlée.','detail5']]],
