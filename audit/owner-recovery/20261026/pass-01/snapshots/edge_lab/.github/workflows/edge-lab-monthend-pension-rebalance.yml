name: Edge Lab Month-End Pension Rebalance L1

on:
  push:
    branches:
      - research/edge-lab-continuous
    paths:
      - research/edge_lab/discovery/experiments/disc-monthend-pension-rebalance-spytlt-l1-v1.run.py

permissions:
  contents: write

concurrency:
  group: edge-lab-monthend-pension-rebalance-spytlt-l1-v1
  cancel-in-progress: false

jobs:
  execute-frozen-look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-lab-continuous
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen one-shot L1
        run: python research/edge_lab/discovery/experiments/disc-monthend-pension-rebalance-spytlt-l1-v1.run.py
      - name: Persist result if produced
        run: |
          RESULT='research/edge_lab/discovery/experiments/disc-monthend-pension-rebalance-spytlt-l1-v1.result.json'
          test -f "$RESULT"
          git config user.name 'Quant Edge Lab'
          git config user.email 'edge-lab@users.noreply.github.com'
          git add "$RESULT"
          if git diff --cached --quiet; then
            echo 'No new result to persist.'
            exit 0
          fi
          git commit -m 'edge-lab: complete frozen month-end pension rebalance L1 [skip ci]'
          git pull --rebase origin research/edge-lab-continuous
          git push origin HEAD:research/edge-lab-continuous
