{% extends "base.html" %}
{% block title %}Créer le compte{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-1">Créer le compte de l'établissement</h1>
<p class="text-sm text-gray-500 mb-3">
  Un seul compte, partagé par l'équipe sur l'appareil de la cuisine.
</p>

{% if error %}
<div class="mb-3 rounded border px-3 py-2 text-sm flash-error">{{ error }}</div>
{% endif %}

<form method="post" action="/setup" class="bg-white rounded border p-4 space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1" for="restaurant_name">Nom du restaurant</label>
    <input id="restaurant_name" name="restaurant_name" value="{{ restaurant_name or '' }}"
           class="w-full border rounded px-3 py-2" />
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username"
           value="{{ email or '' }}" class="w-full border rounded px-3 py-2" />
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required minlength="8"
           autocomplete="new-password" class="w-full border rounded px-3 py-2" />
    <p class="text-xs text-gray-500 mt-1">8 caractères minimum.</p>
  </div>
  <button type="submit" class="w-full bg-emerald-600 text-white px-4 py-3 rounded font-medium text-lg">
    Créer le compte
  </button>
</form>
{% endblock %}
