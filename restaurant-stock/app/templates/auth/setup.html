{% extends "base.html" %}
{% block title %}Créer le compte{% endblock %}
{% block content %}
<h1 class="section-titre mt-4 mb-1">Créer le compte de l'établissement</h1>
<p class="secondaire mb-4">Un seul compte, partagé par l'équipe sur l'appareil de la cuisine.</p>

{% if error %}
<div class="mb-4 rounded px-4 py-4 text-base flash-error">{{ error }}</div>
{% endif %}

<form method="post" action="/setup" class="space-y-6">
  <div>
    <label class="secondaire block mb-2" for="restaurant_name">Nom du restaurant</label>
    <input id="restaurant_name" name="restaurant_name" value="{{ restaurant_name or '' }}" class="select text-corps" />
  </div>
  <div>
    <label class="secondaire block mb-2" for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username"
           value="{{ email or '' }}" class="select text-corps" />
  </div>
  <div>
    <label class="secondaire block mb-2" for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required minlength="8"
           autocomplete="new-password" class="select text-corps" />
    <p class="secondaire mt-2">8 caractères minimum.</p>
  </div>
  <button type="submit" class="btn btn-principal w-full text-titre2">Créer le compte</button>
</form>
{% endblock %}
