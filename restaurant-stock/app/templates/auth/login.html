{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-3">Connexion</h1>

{% if error %}
<div class="mb-3 rounded border px-3 py-2 text-sm flash-error">{{ error }}</div>
{% endif %}

<form method="post" action="/login" class="bg-white rounded border p-4 space-y-4">
  <input type="hidden" name="next" value="{{ next or '/' }}" />
  <div>
    <label class="block text-sm font-medium mb-1" for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username"
           value="{{ email or '' }}" class="w-full border rounded px-3 py-2" />
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required autocomplete="current-password"
           class="w-full border rounded px-3 py-2" />
  </div>
  <button type="submit" class="w-full bg-emerald-600 text-white px-4 py-3 rounded font-medium text-lg">
    Se connecter
  </button>
  <p class="text-xs text-gray-500">
    La session reste ouverte 30 jours sur cet appareil : pas de mot de passe à
    retaper à chaque comptage.
  </p>
</form>
{% endblock %}
