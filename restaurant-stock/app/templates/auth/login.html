{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<h1 class="section-titre mt-4 mb-4">Connexion</h1>

{% if error %}
<div class="mb-4 rounded px-4 py-4 text-base flash-error">{{ error }}</div>
{% endif %}

<form method="post" action="/login" class="space-y-6">
  <input type="hidden" name="next" value="{{ next or '/' }}" />
  <div>
    <label class="secondaire block mb-2" for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username"
           value="{{ email or '' }}" class="select text-corps" />
  </div>
  <div>
    <label class="secondaire block mb-2" for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required autocomplete="current-password"
           class="select text-corps" />
  </div>
  <button type="submit" class="btn btn-principal w-full text-titre2">Se connecter</button>
  <p class="secondaire">
    La session reste ouverte 30 jours sur cet appareil : pas de mot de passe à
    retaper à chaque comptage.
  </p>
</form>
{% endblock %}
