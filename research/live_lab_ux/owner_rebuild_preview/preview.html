<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<title>Quant-Trade — Live Research Lab / Owner Rebuild Preview</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<main id="app" class="app" aria-label="Quant-Trade Live Research Lab">
  <canvas id="gl" aria-label="Laboratoire 3D interactif"></canvas>
  <div id="fallback" class="fallback" hidden>
    <div class="fallback-core"></div><div class="fallback-ring"></div>
  </div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <header class="hud hud-top">
    <div class="brand"><span class="brand-mark">QT</span><span class="brand-copy">LIVE RESEARCH LAB<small>OBSERVATORY / 02</small></span></div>
    <div class="live-pill"><i></i><span id="connection">LIVE</span></div>
  </header>
  <div class="hud hud-left-bottom">
    <div class="datum"><small>LAST EVENT</small><strong id="last-event">22:23:41</strong></div>
    <div class="datum"><small>ECONOMIC LOOK</small><strong id="economic">FREE</strong></div>
  </div>
  <div class="hud hud-right-bottom">
    <button class="icon-btn" id="reset" aria-label="Recentrer">◎</button>
    <button class="icon-btn" id="zoom-out" aria-label="Dézoomer">−</button>
    <button class="icon-btn" id="zoom-in" aria-label="Zoomer">+</button>
  </div>
  <div id="zone-layer" class="zone-layer" aria-hidden="true"></div>
  <button id="worker-chip" class="worker-chip" hidden>
    <span class="worker-dot"></span><span><strong>Worker</strong><small>ACTIVE · CODING / TESTING</small></span><b>↗</b>
  </button>
  <section id="worker-panel" class="worker-panel" hidden aria-label="Worker detail">
    <div class="panel-kicker">OBSERVED WORKER</div>
    <div class="panel-title"><h2>Worker</h2><span class="state">WORKING</span></div>
    <p>Benign live task · coding / testing</p>
    <dl><div><dt>Progress</dt><dd>Unknown</dd></div><div><dt>Evidence</dt><dd>Event-backed</dd></div></dl>
    <button id="close-panel">Close</button>
  </section>
  <div class="safety">REAL CAPITAL OFF <span>·</span> LIVE TRADING OFF</div>
  <div id="hint" class="hint">DRAG TO ORBIT · PINCH TO ZOOM · TAP AN ACTIVE WORKER</div>
</main>
<script src="preview.js"></script>
</body>
</html>
