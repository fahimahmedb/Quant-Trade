<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Quant-Trade — Calibration UX</title><style>:root{color-scheme:dark;--bg:#0b0d12;--p:#131722;--l:#293040;--t:#f6f7fa;--m:#9ba5b4;--a:#ff7d63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100dvh;max-width:760px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;font-size:12px;color:var(--m)}.top b{color:#fff}.bar{height:4px;background:#202532;border-radius:20px;margin:16px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:20px;width:0;transition:.2s}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}.k{font-size:10px;letter-spacing:.16em;color:var(--a);font-weight:750;text-transform:uppercase;margin-bottom:13px}h1{font-size:clamp(28px,8vw,46px);line-height:1.04;letter-spacing:-.045em;margin:0 0 12px}p{color:var(--m);font-size:14px;line-height:1.5;margin:0 0 24px}.opts{display:grid;gap:10px}.o{width:100%;min-height:62px;border:1px solid var(--l);background:linear-gradient(#171c27,#111620);color:var(--t);border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}.o:active{transform:scale(.985)}.n{width:28px;height:28px;flex:0 0 28px;border:1px solid #394354;border-radius:9px;display:grid;place-items:center;font-size:11px;color:#bac3cf}.o strong{display:block;font-size:15px}.o small{display:block;color:var(--m);font-size:12px;line-height:1.35;margin-top:3px}.foot{display:flex;justify-content:space-between;align-items:center;min-height:44px}.back{border:0;background:none;color:var(--m);padding:10px 0}.saved{font-size:11px;color:#788493}.card{border:1px solid var(--l);background:linear-gradient(#151a24,#10141c);border-radius:22px;padding:22px}.go,.copy{width:100%;border:0;border-radius:15px;min-height:56px;background:#f5f6f8;color:#10131a;font-weight:750;font-size:15px}.code{margin:20px 0 12px;border:1px dashed #475265;border-radius:15px;padding:18px;text-align:center;font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tag{font-size:11px;border:1px solid #303949;border-radius:999px;padding:7px 9px;color:#d7dde6}.reset{width:100%;border:0;background:none;color:#7d8795;padding:14px}@media(min-width:680px){.opts{grid-template-columns:1fr 1fr}.o{min-height:82px}}</style></head><body><div class="app"><div class="top"><b>QUANT-TRADE UX</b><span id="c"></span></div><div class="bar"><i id="b"></i></div><main class="stage" id="s"></main><footer class="foot" id="f"><button class="back" id="back">← Précédent</button><span class="saved">● enregistré</span></footer></div><script>const V='UX3',K='qt_ux3';const Q=[['Sensation','À l’ouverture, quelle sensation doit arriver en premier ?','Choisis l’impression avant les fonctions.',[['Un vrai lieu miniature','Une pièce crédible et désirable.'],['Un centre d’opérations','Spectaculaire mais pas cliché hacker.'],['Un studio premium','Calme, matière, lumière, design.'],['Un monde de jeu','Un univers à explorer.'],['Un labo scientifique','Expérimental, sérieux et beau.']]],['Caméra','Quelle caméra correspond le mieux à ta vision ?','Elle définit presque toute la perception de la pièce.',[['Isométrique 3/4','Belle maquette vue en diagonale.'],['Orbitale libre','Je tourne autour de la pièce.'],['Vue du dessus','Très jeu de gestion.'],['Cinématique','Angles bas et spectaculaires.'],['Diorama fixe','Un cadrage parfait avant tout.']]],['Échelle','Quelle taille doit avoir le labo ?','On fixe la sensation d’espace.',[['Compact et dense','Une salle très travaillée.'],['Salle moyenne','6–10 postes lisibles.'],['Grand plateau','Un étage avec plusieurs zones.'],['Plusieurs pièces','Chaque fonction a son espace.'],['Campus miniature','Un petit monde complet.']]],['Style 3D','Quel niveau de réalisme veux-tu ?','Il s’agit du langage visuel, pas de la qualité.',[['Stylisé premium','Comme un excellent jeu de gestion.'],['Semi-réaliste','Matériaux crédibles, humains stylisés.'],['Très réaliste','Proportions et lumière proches du réel.'],['Maquette architecturale','Miniature de designer.'],['Illustratif','Graphique et éditorial en 3D.']]],['Workers','À quoi doivent ressembler les workers ?','Ils n’apparaissent que si un événement réel les justifie.',[['Humains miniatures stylisés','Adultes, lisibles, pas enfantins.'],['Humains semi-réalistes','Gestes et vêtements crédibles.'],['Personnages simples','Priorité aux mouvements.'],['Silhouettes abstraites','Présence sans identité forte.'],['Robots / agents','Le côté IA est assumé.']]],['Au repos','Quand aucun worker n’est actif, que doit-on voir ?','Aucune fausse activité.',[['Une pièce vide mais magnifique','Le décor suffit.'],['Une pièce vivante sans travail','Lumières, plantes, ambiance.'],['Des postes en veille','Équipements visibles et neutres.'],['Presque immobile','Comme une photographie 3D.'],['Une architecture forte','Les zones racontent le système.']]],['Couleurs','Quelle palette t’attire le plus ?','On pourra l’affiner ensuite.',[['Crème · bois · sauge','Chaleureux et premium.'],['Bleu nuit · ambre','Cinématique et sérieux.'],['Blanc · verre · vert','Scientifique et lumineux.'],['Charbon · acier · orange','Industriel et sophistiqué.'],['Beige · brun · accents','Atelier de design.']]],['Lumière','Quelle lumière doit dominer ?','Elle change immédiatement le niveau perçu.',[['Grand jour doux','Fenêtres et ombres légères.'],['Golden hour','Chaleur et rayons cinématiques.'],['Studio neutre','Propre, maîtrisé, lisible.'],['Nocturne chaleureux','Lampes et écrans discrets.'],['Dramatique','Volumes sculptés par la lumière.']]],['Détails','À quel point la pièce doit-elle être remplie ?','Livres, câbles, objets, tableaux, plantes…',[["Très épurée",'Peu d’éléments, chacun très beau.'],['Équilibrée','Crédible sans brouiller la lecture.'],['Dense','Beaucoup de choses à observer.'],['Très dense','Presque un décor de cinéma.'],['Variable','Chaque zone a sa densité.']]],['Interface','À quel point l’UI doit-elle être visible autour de la 3D ?','On sépare le monde et la donnée.',[['Presque invisible','La scène prend 80–90% de l’attention.'],['Discrète et premium','Quelques informations très bien placées.'],['Équilibrée','3D et données ont le même poids.'],['Panneau latéral riche','Scène + détail du travail.'],['HUD immersif','Informations intégrées au monde.']]],['Mobile','Sur iPhone, qu’est-ce qui doit prendre la place en premier ?','Le téléphone est une cible prioritaire.',[['3D presque plein écran','Je veux d’abord explorer le labo.'],['3D puis panneau compact','La scène domine.'],['Écran partagé','3D et infos toujours visibles.'],['Carte + fiche worker','Navigation très efficace.'],['Immersif puis détails au tap','Rien ne gêne la scène avant sélection.']]],['Organisation','Comment les activités doivent-elles être réparties ?','Architecture fonctionnelle du labo.',[['Postes autour d’un cœur','Tout converge au centre.'],['Zones spécialisées','Data, recherche, validation, mémoire…'],['Petites salles reliées','Chaque fonction a une pièce.'],['Grand open space','Les outils distinguent les rôles.'],['Hybride','Plateau + zones spécialisées.']]],['Centre','Que veux-tu au centre du laboratoire ?','Il peut devenir son icône visuelle.',[['Noyau scientifique','Physique, sculptural, mystérieux.'],['Table de recherche','Documents et écrans communs.'],['Hologramme / globe data','Spectaculaire seulement quand factuel.'],['Arbre de connaissance','Preuves et branches visibles.'],['Rien','Pas de gimmick central.']]],['Animation','Quand un worker travaille réellement, quel niveau d’animation veux-tu ?','Toujours piloté par des événements réels.',[['Subtil et crédible','Taper, lire, petits déplacements.'],['Très vivant','Plus de gestes sans cartoon.'],['Simulation de gestion','Mouvements lisibles et assumés.'],['Cinématique','Lents, beaux, moins fréquents.'],['Très sobre','Strict nécessaire.']]],['Compréhension','Comment veux-tu comprendre ce que fait un worker ?','Sans inventer de pourcentage ni de résultat.',[['Par son geste','Détails seulement au tap.'],['Petite étiquette','Nom + état au-dessus.'],['Par son poste','Objets et écrans évoluent factuellement.'],['Panneau latéral','Le monde reste propre.'],['Combinaison légère','Geste + label + fiche au tap.']]],['À bannir','Qu’est-ce qui doit absolument disparaître ?','Choisis ce qui t’a le plus dérangé.',[['Le dashboard technique','Trop de cartes et statuts.'],['La pièce vide / cheap','Objets simples, aucun caractère.'],['Le côté hacker / crypto','Néons, noir, cliché trading.'],['Le côté jouet','Trop cartoon ou enfantin.'],['Le manque de hiérarchie','On ne sait pas où regarder.']]],['Critère final','Si je réussis une seule chose, laquelle doit te faire dire « oui, c’est ça » ?','Ce choix aura le plus de poids.',[['Envie d’explorer','Le monde est désirable avant les données.'],['Croire au vrai labo','Crédibilité et cohérence.'],['Effet premium immédiat','Très travaillé dès la première seconde.'],['Comprendre sans lire','L’architecture explique le système.'],['Voir le travail vivre','L’activité réelle devient évidente.']]]];let st={i:0,a:Array(Q.length).fill(null),start:false};try{let x=JSON.parse(localStorage.getItem(K));if(x&&x.v===V&&x.a?.length===Q.length)st=x}catch{}const $=x=>document.querySelector(x),S=$('#s'),C=$('#c'),B=$('#b'),F=$('#f'),BACK=$('#back');function save(){localStorage.setItem(K,JSON.stringify({...st,v:V,t:new Date().toISOString()}))}function pack(){let z='';st.a.forEach(v=>z+=(v??0).toString(2).padStart(3,'0'));while(z.length%8)z+='0';let q='';for(let i=0;i<z.length;i+=8)q+=String.fromCharCode(parseInt(z.slice(i,i+8),2));return V+'-'+btoa(q).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function intro(){C.textContent='';B.style.width='0';F.hidden=true;S.innerHTML='<div class="card"><div class="k">Calibration visuelle</div><h1>On repart de ta perception.</h1><p>Une question à la fois. Tu touches simplement la réponse qui te ressemble le plus. Chaque clic est enregistré automatiquement.</p><button class="go">Commencer</button></div>';S.querySelector('.go').onclick=()=>{st.start=true;save();render()}}function done(){C.textContent='Terminé';B.style.width='100%';F.hidden=true;let code=pack();S.innerHTML='<div class="card"><div class="k">Profil enregistré</div><h1>J’ai ton profil visuel.</h1><p>Tu n’as rien à recopier sauf ce petit code. Envoie-le moi dans le chat.</p><div class="code">'+code+'</div><button class="copy">Copier le code UX</button><button class="reset">Recommencer</button></div>';S.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);S.querySelector('.copy').textContent='Copié ✓'}catch{prompt('Copie ce code :',code)}};S.querySelector('.reset').onclick=()=>{st={i:0,a:Array(Q.length).fill(null),start:true};save();render()}}function render(){if(!st.start)return intro();if(st.i>=Q.length)return done();F.hidden=false;let q=Q[st.i];C.textContent=(st.i+1)+' / '+Q.length;B.style.width=(st.i/Q.length*100)+'%';BACK.disabled=st.i===0;S.innerHTML='<div class="k">'+q[0]+'</div><h1>'+q[1]+'</h1><p>'+q[2]+'</p><div class="opts">'+q[3].map((o,i)=>'<button class="o" data-i="'+i+'"><span class="n">'+String.fromCharCode(65+i)+'</span><span><strong>'+o[0]+'</strong><small>'+o[1]+'</small></span></button>').join('')+'</div>';S.querySelectorAll('.o').forEach(b=>b.onclick=()=>{st.a[st.i]=+b.dataset.i;st.i++;save();render();scrollTo(0,0)})}BACK.onclick=()=>{if(st.i){st.i--;save();render();scrollTo(0,0)}};render();</script></body></html>
