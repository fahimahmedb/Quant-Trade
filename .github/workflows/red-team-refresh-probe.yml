name: Red-team refresh probe
on:
  push:
    branches: [reviewer/v1-final-red-team]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=src:tests python3 -c "import tempfile; from test_quant_system import SystemTests; t=SystemTests(); d=tempfile.TemporaryDirectory(); root=t.build(d.name,400); s=t.system(root); s.boot(); s.tick(); task=next(x for x in s.queue.tasks.values() if x.status=='COMPLETED'); frozen=s.strategies.research_partition('fixture'); before=task.metadata['result']; t.build(d.name,430); r=t.system(root); r.boot(); q=r.queue.tasks[task.task_id]; print('frozen',frozen,'status',q.status,'history',q.metadata.get('execution_history')); assert not (r.strategies.research_partition('fixture')==frozen and q.status=='PENDING'), 'append-only shadow data reactivated a frozen research experiment that cannot see the new rows'"
