name: QT P3 frozen historical calibration (one-shot, no trading)
on:
  push:
    branches: [code/canonical]
    paths:
      - ".github/workflows/qt-p3-spf-calibration-20261125.yml"
permissions:
  contents: read
jobs:
  bounded-replay:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact admitted subject before any outcomes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.before }}" = "18fddb1e973deb2c2ffaedae211f42b5bd2bfd23"
          git fetch --no-tags origin project/canonical
          test "$(git rev-parse FETCH_HEAD)" = "d772dd96cdac107363dec1503c5cf60e49bc4862"
          git show FETCH_HEAD:governance/AI_WORKING_METHOD_V1.json > /tmp/qt-p3-contract.json
          git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' > /tmp/qt-p3-branches.txt
          python scripts/validate_ai_working_method.py /tmp/qt-p3-contract.json AGENTS.md --branches-file /tmp/qt-p3-branches.txt --admission .quant/MISSION_ADMISSION.json --current-project-sha d772dd96cdac107363dec1503c5cf60e49bc4862 --current-code-sha 18fddb1e973deb2c2ffaedae211f42b5bd2bfd23 --current-router-identity governance/CURRENT_PROJECT_STATE.md@45984e9a8de5480a5baab8d4b6c64d27ebedb06c --expected-mission-id QT_P3_SPF_CALIBRATION_20261125
      - name: Execute synthetic checks before accessing source outcomes
        run: python research/edge_lab/discovery/experiments/qt-p3-spf-calibration-20261125.py --self-test
      - name: Acquire public historical data and evaluate frozen benchmark once
        run: python research/edge_lab/discovery/experiments/qt-p3-spf-calibration-20261125.py
