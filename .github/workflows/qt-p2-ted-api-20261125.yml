name: QT P2 fixed TED award metadata enrichment (one-shot)
on:
  push:
    branches: [code/canonical]
    paths:
      - ".github/workflows/qt-p2-ted-api-20261125.yml"
permissions:
  contents: read
jobs:
  bounded-source:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact admitted subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.before }}" = "185a14b9a390f6e7f6c58babe1519cb68f70051a"
          git fetch --no-tags origin project/canonical
          test "$(git rev-parse FETCH_HEAD)" = "d772dd96cdac107363dec1503c5cf60e49bc4862"
          git show FETCH_HEAD:governance/AI_WORKING_METHOD_V1.json > /tmp/qt-p2-contract.json
          git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' > /tmp/qt-p2-branches.txt
          python scripts/validate_ai_working_method.py /tmp/qt-p2-contract.json AGENTS.md --branches-file /tmp/qt-p2-branches.txt --admission .quant/MISSION_ADMISSION.json --current-project-sha d772dd96cdac107363dec1503c5cf60e49bc4862 --current-code-sha 185a14b9a390f6e7f6c58babe1519cb68f70051a --current-router-identity governance/CURRENT_PROJECT_STATE.md@45984e9a8de5480a5baab8d4b6c64d27ebedb06c --expected-mission-id QT_P2_TED_AWARD_ENRICHMENT_20261125
      - name: Synthetic schema and truncation checks
        run: python research/edge_lab/discovery/experiments/qt-p2-ted-award-enrichment-20261125.py --self-test
      - name: One frozen award metadata request
        run: python research/edge_lab/discovery/experiments/qt-p2-ted-award-enrichment-20261125.py
