name: Reviewer apply repairs

on:
  push:
    branches: [reviewer/v1-final-red-team]
    paths: [.github/workflows/reviewer-apply-repairs.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reviewer/v1-final-red-team
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply asserted patch
        run: python3 scripts/reviewer_apply_repairs.py
      - name: Commit repair
        run: |
          git config user.name "Quant V1 Independent Reviewer"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: close final V1 red-team defects"
          git push origin HEAD:reviewer/v1-final-red-team

# red-team trigger: final demonstrated repairs
