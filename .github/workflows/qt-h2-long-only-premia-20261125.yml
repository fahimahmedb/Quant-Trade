name: QT H2 long-only premia economic batch (one-shot)
on:
  push:
    branches: [code/canonical]
    paths:
      - ".github/workflows/qt-h2-long-only-premia-20261125.yml"
permissions:
  contents: read
jobs:
  bounded-replay:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact admitted subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.before }}" = "377134cca70b5201a06a824b060421fc7143fd5e"
          git fetch --no-tags origin project/canonical
          test "$(git rev-parse FETCH_HEAD)" = "d772dd96cdac107363dec1503c5cf60e49bc4862"
          git show FETCH_HEAD:governance/AI_WORKING_METHOD_V1.json > /tmp/qt-h2-contract.json
          git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' > /tmp/qt-h2-branches.txt
          python scripts/validate_ai_working_method.py /tmp/qt-h2-contract.json AGENTS.md --branches-file /tmp/qt-h2-branches.txt --admission .quant/MISSION_ADMISSION.json --current-project-sha d772dd96cdac107363dec1503c5cf60e49bc4862 --current-code-sha 377134cca70b5201a06a824b060421fc7143fd5e --current-router-identity governance/CURRENT_PROJECT_STATE.md@45984e9a8de5480a5baab8d4b6c64d27ebedb06c --expected-mission-id QT_H2_LONG_ONLY_PREMIA_20261125
      - name: Synthetic parser and accounting checks
        run: python research/edge_lab/discovery/experiments/qt-h2-long-only-premia-20261125.py --self-test
      - name: Evaluate fixed allocations in both regions
        run: python research/edge_lab/discovery/experiments/qt-h2-long-only-premia-20261125.py
