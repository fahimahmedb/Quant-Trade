name: MEGA C0 Semantic Independence Hardening Once

on:
  push:
    branches:
      - builder/mega-c0-scientific-adjudication-20261021

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch semantic confirmation semantics and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          code_path = Path('research/research_os/expansion/scientific_adjudication.py')
          code = code_path.read_text()
          old = '    independent_confirmation = structural_proven and support_relation == "PRIMARY_SOURCE_RECONSTRUCTION"\n'
          new = (
              '    semantic_diverse_review = record.get("semantic_diverse_review", "NOT_PROVEN")\n'
              '    semantic_review_proven = semantic_diverse_review == "PROVEN_INDEPENDENT_SEMANTIC_REVIEW"\n'
              '    independent_confirmation = (\n'
              '        structural_proven\n'
              '        and support_relation == "PRIMARY_SOURCE_RECONSTRUCTION"\n'
              '        and semantic_review_proven\n'
              '    )\n'
          )
          assert old in code, 'independence confirmation assignment not found'
          code = code.replace(old, new, 1)

          old = (
              '        "independent_confirmation_count": 1 if independent_confirmation else 0,\n'
              '        "semantic_diverse_review": record.get("semantic_diverse_review", "NOT_PROVEN"),\n'
          )
          new = (
              '        "independent_confirmation_count": 1 if independent_confirmation else 0,\n'
              '        "semantic_diverse_review": semantic_diverse_review,\n'
              '        "semantic_independent_confirmation_proven": semantic_review_proven,\n'
          )
          assert old in code, 'independence ref fields not found'
          code = code.replace(old, new, 1)

          old = (
              '    if ref.get("support_relation") in {"DUPLICATE", "WRAPPER_EQUIVALENT", "UNKNOWN"}:\n'
              '        _require(ref.get("independent_confirmation_count") == 0,\n'
              '                 "duplicate/wrapper/unknown support cannot count as independent confirmation")\n'
          )
          new = old + (
              '    if ref.get("semantic_independent_confirmation_proven") is not True:\n'
              '        _require(ref.get("independent_confirmation_count") == 0,\n'
              '                 "unproven semantic review cannot count as independent confirmation")\n'
          )
          assert old in code, 'independence validation block not found'
          code = code.replace(old, new, 1)

          old = (
              '        "independent_confirmation_count": (\n'
              '            independence_ref.get("independent_confirmation_count", 0) if independence_ref else 0\n'
              '        ),\n'
              '        "scientific_negative_claim": verdict == "KILL",\n'
          )
          new = (
              '        "independent_confirmation_count": (\n'
              '            independence_ref.get("independent_confirmation_count", 0) if independence_ref else 0\n'
              '        ),\n'
              '        "semantic_independent_confirmation_proven": (\n'
              '            independence_ref.get("semantic_independent_confirmation_proven", False)\n'
              '            if independence_ref else False\n'
              '        ),\n'
              '        "scientific_negative_claim": verdict == "KILL",\n'
          )
          assert old in code, 'adjudication independence projection not found'
          code = code.replace(old, new, 1)
          code_path.write_text(code)

          test_path = Path('tests/test_mega_c0_scientific_adjudication.py')
          tests = test_path.read_text()
          old = (
              '    def test_independence_primary_reconstruction_counts_once(self):\n'
              '        validate_independence_ref(self.independence, self.factory)\n'
              '        self.assertEqual(self.independence["status"], "PASS")\n'
              '        self.assertEqual(self.independence["independent_confirmation_count"], 1)\n\n'
          )
          new = (
              '    def test_independence_primary_reconstruction_does_not_overclaim_semantic_confirmation(self):\n'
              '        validate_independence_ref(self.independence, self.factory)\n'
              '        self.assertEqual(self.independence["status"], "PASS")\n'
              '        self.assertEqual(self.independence["independent_confirmation_count"], 0)\n'
              '        self.assertFalse(self.independence["semantic_independent_confirmation_proven"])\n\n'
              '    def test_explicit_semantic_independence_can_count_once(self):\n'
              '        record = independence_record()\n'
              '        record["semantic_diverse_review"] = "PROVEN_INDEPENDENT_SEMANTIC_REVIEW"\n'
              '        ref = bind_independence_ref(self.factory, record)\n'
              '        validate_independence_ref(ref, self.factory)\n'
              '        self.assertTrue(ref["semantic_independent_confirmation_proven"])\n'
              '        self.assertEqual(ref["independent_confirmation_count"], 1)\n\n'
          )
          assert old in tests, 'primary independence test not found'
          tests = tests.replace(old, new, 1)

          marker = '        self.assertEqual(result["economic_result"], "NOT_OBSERVED")\n'
          assert marker in tests, 'PROMOTE assertion marker not found'
          replacement = marker + (
              '        self.assertFalse(result["semantic_independent_confirmation_proven"])\n'
              '        self.assertEqual(result["independent_confirmation_count"], 0)\n'
          )
          tests = tests.replace(marker, replacement, 1)
          test_path.write_text(tests)
          PY
      - name: Run focused C0 suite
        run: python -m unittest discover -s tests -p 'test_mega_c0_scientific_adjudication.py' -v
      - name: Self-remove and push atomic hardening commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quant-trade-builder'
          git config user.email 'quant-trade-builder@users.noreply.github.com'
          git rm .github/workflows/mega-c0-semantic-hardening-once.yml
          git add research/research_os/expansion/scientific_adjudication.py tests/test_mega_c0_scientific_adjudication.py
          git commit -m 'fix(mega-c0): distinguish structural from semantic independence'
          git push origin HEAD:builder/mega-c0-scientific-adjudication-20261021
