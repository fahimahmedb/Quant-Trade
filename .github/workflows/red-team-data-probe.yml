name: Red-team data probe
on:
  push:
    branches: [reviewer/v1-final-red-team]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: duplicate bar
        run: PYTHONPATH=src python3 -c "from quant.dataplane.panel import PricePanel; r={'date':'2025-01-01','symbol':'AAA','open':1,'high':1,'low':1,'close':1,'adj_close':1,'volume':1}; q=dict(r,close=2,adj_close=2,high=2,low=2,open=2); p=PricePanel([r,q]); print(p.bars); assert len(p.bars)==2"
      - name: non finite
        run: PYTHONPATH=src python3 -c "from quant.dataplane.panel import PricePanel; from quant.dataplane.validation import validate_panel; rows=[{'date':f'2025-{i//28+1:02d}-{i%28+1:02d}','symbol':'AAA','open':1,'high':1,'low':1,'close':(float('nan') if i==20 else 1),'adj_close':(float('nan') if i==20 else 1),'volume':1} for i in range(250)]; v=validate_panel(PricePanel(rows),['AAA']); print(v); assert not v['passed']"
