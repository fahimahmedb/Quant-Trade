name: Research OS persistent final-shape CI

on:
  push:
    branches:
      - builder/research-os-aggressive-architecture-20261015
    paths:
      - 'research/research_os/expansion/persistent_state.py'
      - 'research/research_os/tests/test_persistent_final_shape.py'
      - '.github/workflows/research-os-persistent-final-shape-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-final-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize pinned reconciled legacy ledger read-only
        run: |
          set -euo pipefail
          LEGACY_COMMIT=183ad65ff260b903a16548ce37948f54d47a9ec8
          git fetch --depth=1 origin "$LEGACY_COMMIT"
          mkdir -p research/research_os/legacy
          git show FETCH_HEAD:LEGACY_RESEARCH_LEDGER.json > research/research_os/legacy/LEGACY_RESEARCH_LEDGER.imported.json
          test "$(git hash-object research/research_os/legacy/LEGACY_RESEARCH_LEDGER.imported.json)" = "ba9b165aaf96956776672df51233bb9bf1e6cbc9"
      - name: Run persistent final-shape tests
        run: python -m unittest research.research_os.tests.test_persistent_final_shape -v
      - name: Assert persistent state and authority closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.research_os.expansion.persistent_state import build_persistent_final_shape
          base = Path('research/research_os')
          fixture = json.loads((base / 'simulations' / 'aggressive_architecture_fixture.json').read_text())
          result = build_persistent_final_shape(
              fixture,
              legacy_ledger_path=base / 'legacy' / 'LEGACY_RESEARCH_LEDGER.imported.json',
          )
          assert result['persistent_state_status'] == 'PASS'
          assert result['legacy']['gate_status'] == 'PASS'
          assert result['legacy']['summary']['source_commit'] == '183ad65ff260b903a16548ce37948f54d47a9ec8'
          assert result['scientific_ledger']['verified'] is True
          assert result['experiment_registry']['immutable'] is True
          assert result['forward_registry']['immutable'] is True
          assert all(v is False for v in result['authority'].values())
          assert all(r['observation_started'] is False for r in result['forward_farm'])
          print('PERSISTENT_FINAL_SHAPE=PASS')
          PY
