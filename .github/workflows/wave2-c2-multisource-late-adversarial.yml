name: Wave2 C2 Multi-Source Late Adversarial Closure

on:
  push:
    branches:
      - builder/convergence-wave2-canonical-20261021
  workflow_dispatch:

permissions:
  contents: read

env:
  WAVE2_IMMUTABLE_BASE_SHA: 2b99d8aeb8a342f1ef32544247d366cb8a26037e
  MULTISOURCE_PRIOR_QUALIFICATION_HEAD: b9b7c1bd9efeaaf74c236f29d88e1a3c6fe759e5
  MULTISOURCE_LATE_QUALIFICATION_HEAD: b344e868096f36e80abc2bec79ee6e5ad8edcdfa
  MULTISOURCE_OUTCOME_FIREWALL_REPAIR: 884632a1fc332df8155eaa5e0557521497dc6d4b
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

jobs:
  late-adversarial-closure:
    name: Qualify every post-b9b7 Multi-Source adversarial test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact canonical head and repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${WAVE2_IMMUTABLE_BASE_SHA}" HEAD
          git merge-base --is-ancestor "${MULTISOURCE_OUTCOME_FIREWALL_REPAIR}" HEAD
          git fetch origin "+refs/heads/builder/multi-source-ideation-intake-20261021:refs/remotes/origin/builder/multi-source-ideation-intake-20261021"
          git cat-file -e "${MULTISOURCE_PRIOR_QUALIFICATION_HEAD}^{commit}"
          git cat-file -e "${MULTISOURCE_LATE_QUALIFICATION_HEAD}^{commit}"
          git merge-base --is-ancestor "${MULTISOURCE_PRIOR_QUALIFICATION_HEAD}" "${MULTISOURCE_LATE_QUALIFICATION_HEAD}"

      - name: Prove late source delta is test-only and complete
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${MULTISOURCE_PRIOR_QUALIFICATION_HEAD}" "${MULTISOURCE_LATE_QUALIFICATION_HEAD}" > /tmp/ms-late.paths
          test -s /tmp/ms-late.paths
          if grep -Ev '^tests/test_multi_source_ideation_v2_.*\.py$' /tmp/ms-late.paths; then
            echo 'NON_TEST_LATE_MULTISOURCE_DELTA=TRUE' >&2
            exit 1
          fi
          test "$(wc -l < /tmp/ms-late.paths | tr -d ' ')" = "18"
          echo 'MULTISOURCE_LATE_DELTA=18_TEST_ONLY_FILES'

      - name: Prove recursive outcome firewall is present
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'OUTCOME_BEARING_KEYS' research/research_os/multi_source_ideation.py
          grep -F 'def _reject_outcome_fields' research/research_os/multi_source_ideation.py
          python3 -m unittest -v tests.test_multi_source_ideation_v2_nested_outcome_firewall

      - name: Extract and run every late adversarial test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ms-late-tests
          mkdir -p /tmp/ms-late-tests
          while IFS= read -r src; do
            dst="/tmp/ms-late-tests/$(basename "$src")"
            git show "${MULTISOURCE_LATE_QUALIFICATION_HEAD}:${src}" > "$dst"
            test "$(git hash-object "$dst")" = "$(git rev-parse "${MULTISOURCE_LATE_QUALIFICATION_HEAD}:${src}")"
          done < /tmp/ms-late.paths
          python3 -m unittest discover -s /tmp/ms-late-tests -p 'test_multi_source_ideation_v2_*.py' -v 2>&1 | tee /tmp/ms-late-tests.log
          grep -Eq '^Ran [1-9][0-9]* tests' /tmp/ms-late-tests.log

      - name: Regress all committed canonical Multi-Source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v research.research_os.tests.test_multi_source_ideation_v2
          python3 -m unittest discover -s tests -p 'test_multi_source_ideation_v2*.py' -v

      - name: Prove authority membrane remains closed
        run: |
          python3 - <<'PY'
          from research.research_os.multi_source_ideation import side_effect_zeroes
          z = side_effect_zeroes()
          assert z
          assert all(value == 0 for value in z.values()), z
          print('MULTISOURCE_AUTHORITY_SIDE_EFFECTS_ZERO=TRUE')
          PY

      - name: Clean working tree
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Emit late adversarial exact-head receipt
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'mission': 'WAVE2_C2_MULTISOURCE_LATE_ADVERSARIAL_CLOSURE',
              'qualified_head': os.environ['GITHUB_SHA'],
              'prior_qualification_head': os.environ['MULTISOURCE_PRIOR_QUALIFICATION_HEAD'],
              'late_qualification_head': os.environ['MULTISOURCE_LATE_QUALIFICATION_HEAD'],
              'outcome_firewall_repair': os.environ['MULTISOURCE_OUTCOME_FIREWALL_REPAIR'],
              'late_delta_test_only': True,
              'late_test_files': 18,
              'recursive_outcome_firewall': 'PASS',
              'authority_side_effects_zero': True,
              'outcome_accessed': False,
          }
          Path('/tmp/wave2-c2-multisource-late.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wave2-c2-multisource-late-${{ github.sha }}
          path: /tmp/wave2-c2-multisource-late.json
