name: Research OS autonomous loop CI

on:
  push:
    branches:
      - builder/research-os-autonomous-loop-20261015
  workflow_dispatch:

jobs:
  preprod-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Research OS preprod simulation tests
        run: node --test research/research_os/tests/*.test.mjs
