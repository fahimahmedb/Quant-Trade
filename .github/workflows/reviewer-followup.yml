name: Reviewer follow-up

on:
  push:
    branches: [reviewer/v1-final-red-team]
    paths: [.github/workflows/reviewer-followup.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reviewer/v1-final-red-team
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/reviewer_followup.py
      - run: |
          git config user.name "Quant V1 Independent Reviewer"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "test: close remaining V1 red-team invariants"
          git push origin HEAD:reviewer/v1-final-red-team
