name: Final Two Branch Cleanup

on:
  push:
    branches:
      - project/canonical
    paths:
      - .github/workflows/final-two-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preserve every branch tip, switch default, retire legacy refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROJECT_BRANCH: project/canonical
          CODE_BRANCH: code/canonical
          OLD_DEFAULT_BRANCH: blue/master-v2-2026-09-20
          TEMP_CODE_BRANCH: code/canonical-qualified-tmp
          QUALIFIED_CODE_SHA: fd3f8ce77d3a2f20cc5954c184c4487b44dac1d3
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          project = os.environ['PROJECT_BRANCH']
          code = os.environ['CODE_BRANCH']
          old_default = os.environ['OLD_DEFAULT_BRANCH']
          temp_code = os.environ['TEMP_CODE_BRANCH']
          qualified = os.environ['QUALIFIED_CODE_SHA']
          base = f'https://api.github.com/repos/{repo}'

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'quant-trade-final-cleanup',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {path} -> {exc.code}: {body[:1000]}') from exc
              return json.loads(raw.decode('utf-8')) if raw else None

          def branch_path(name):
              return urllib.parse.quote(name, safe='')

          def list_branches():
              out = []
              page = 1
              while True:
                  batch = api('GET', f'/branches?per_page=100&page={page}')
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          def rename_branch(old, new):
              return api('POST', f'/branches/{branch_path(old)}/rename', {'new_name': new})

          before_repo = api('GET', '')
          branches = list_branches()
          by_name = {b['name']: b['commit']['sha'] for b in branches}
          required = {project, code, old_default}
          missing = sorted(required - set(by_name))
          if missing:
              raise RuntimeError(f'missing required branches before cleanup: {missing}')
          if by_name[code] != qualified:
              raise RuntimeError(f'code branch moved: expected {qualified}, observed {by_name[code]}')
          if before_repo['default_branch'] != old_default:
              raise RuntimeError(
                  f'unexpected default before cleanup: {before_repo["default_branch"]!r}; '
                  f'expected {old_default!r}')

          # Preserve a durable inventory and make every distinct branch tip reachable
          # from project/canonical before any ref deletion. We create a chain of
          # octopus history-anchor commits in bounded parent batches.
          project_head = by_name[project]
          project_commit = api('GET', f'/git/commits/{project_head}')
          receipt = {
              'schema': 'quant-trade-branch-retirement-receipt-v1',
              'created_by_workflow_run': os.environ.get('GITHUB_RUN_ID'),
              'repository': repo,
              'default_branch_before': before_repo['default_branch'],
              'qualified_code_sha': qualified,
              'branch_count_before': len(branches),
              'branches_before': [{'name': b['name'], 'sha': b['commit']['sha']} for b in branches],
              'preservation': 'ALL_DISTINCT_TIPS_ATTACHED_AS_COMMIT_PARENTS_TO_PROJECT_CANONICAL_BEFORE_REF_DELETION',
          }
          blob = api('POST', '/git/blobs', {
              'content': json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              'encoding': 'utf-8',
          })['sha']
          tree = api('POST', '/git/trees', {
              'base_tree': project_commit['tree']['sha'],
              'tree': [{
                  'path': 'governance/BRANCH_RETIREMENT_RECEIPT.json',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob,
              }],
          })['sha']

          distinct_tips = []
          seen = {project_head}
          for item in branches:
              sha = item['commit']['sha']
              if sha not in seen:
                  seen.add(sha)
                  distinct_tips.append(sha)
          anchor = project_head
          batch_size = 40
          for idx in range(0, len(distinct_tips), batch_size):
              chunk = distinct_tips[idx:idx + batch_size]
              commit = api('POST', '/git/commits', {
                  'message': f'cleanup: preserve legacy branch tips batch {idx // batch_size + 1}',
                  'tree': tree,
                  'parents': [anchor] + chunk,
              })
              anchor = commit['sha']
          api('PATCH', f'/git/refs/heads/{urllib.parse.quote(project, safe="/")}', {
              'sha': anchor,
              'force': False,
          })

          # Test branch-rename permission on the non-default canonical code branch.
          rename_branch(code, temp_code)
          try:
              # Renaming the current default branch updates the repository default
              # automatically on GitHub without requiring administration permission.
              rename_branch(old_default, code)
          except Exception:
              try:
                  rename_branch(temp_code, code)
              finally:
                  raise

          try:
              # Replace the renamed old-default ref with the already qualified
              # canonical code commit. The qualified commit is preserved by the
              # project history anchor and by temp_code at this point.
              api('PATCH', f'/git/refs/heads/{urllib.parse.quote(code, safe="/")}', {
                  'sha': qualified,
                  'force': True,
              })
              check = api('GET', f'/branches/{branch_path(code)}')
              repo_mid = api('GET', '')
              if check['commit']['sha'] != qualified:
                  raise RuntimeError('canonical code head did not move to qualified SHA')
              if repo_mid['default_branch'] != code:
                  raise RuntimeError(f'default branch did not follow rename: {repo_mid["default_branch"]}')
          except Exception:
              # Best-effort rollback of names if the qualified ref could not be installed.
              try:
                  rename_branch(code, old_default)
              except Exception:
                  pass
              try:
                  rename_branch(temp_code, code)
              except Exception:
                  pass
              raise

          # Now the two canonical refs are established and every legacy tip is
          # reachable through project/canonical. Delete every other branch ref.
          failures = []
          for b in list_branches():
              name = b['name']
              if name in {code, project}:
                  continue
              ref = urllib.parse.quote('heads/' + name, safe='/')
              try:
                  api('DELETE', f'/git/refs/{ref}')
              except Exception as exc:
                  failures.append({'branch': name, 'error': str(exc)})

          after = list_branches()
          after_names = sorted(b['name'] for b in after)
          repo_after = api('GET', '')
          print(json.dumps({
              'branch_count_before': len(branches),
              'branch_count_after': len(after),
              'branches_after': after_names,
              'default_branch_after': repo_after['default_branch'],
              'qualified_code_sha': api('GET', f'/branches/{branch_path(code)}')['commit']['sha'],
              'project_anchor_sha': api('GET', f'/branches/{branch_path(project)}')['commit']['sha'],
              'delete_failures': failures,
          }, indent=2, sort_keys=True))
          if failures:
              raise RuntimeError(f'legacy branch deletion failures: {failures}')
          if after_names != sorted([code, project]):
              raise RuntimeError(f'expected exactly two branches, got {after_names}')
          if repo_after['default_branch'] != code:
              raise RuntimeError(f'expected default {code}, got {repo_after["default_branch"]}')
          PY
