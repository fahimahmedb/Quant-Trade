name: Final Two Branch Cleanup — PARKED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - name: Branch retirement is parked by Owner decision
        run: |
          echo "PARK: do not delete or rename repository branches."
          echo "Owner decision 2026-10-31: branch cleanup will be performed later."
          echo "No repository mutation is authorized by this workflow."
