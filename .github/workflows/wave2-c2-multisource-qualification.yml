name: Wave2 C2 Canonical Multi-Source Qualification

on:
  push:
    branches:
      - builder/convergence-wave2-canonical-20261021
  workflow_dispatch:

permissions:
  contents: read

env:
  WAVE2_IMMUTABLE_BASE_SHA: 2b99d8aeb8a342f1ef32544247d366cb8a26037e
  MULTISOURCE_MERGED_HEAD: b5ba754188b9029f8a80ebfeea37c98b6f636869
  MULTISOURCE_QUALIFICATION_HEAD: b9b7c1bd9efeaaf74c236f29d88e1a3c6fe759e5
  NORTH_STAR_BLOB: a328b4e6d7d71dafd532938888ebf9818b1b610f
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

jobs:
  qualify-multisource:
    name: Canonical passive Multi-Source intake and cumulative Wave2 proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bind qualification to exact canonical HEAD and source snapshots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${WAVE2_IMMUTABLE_BASE_SHA}" HEAD
          git merge-base --is-ancestor "${MULTISOURCE_MERGED_HEAD}" HEAD
          test "$(git rev-parse HEAD:QUANT_NORTH_STAR.md)" = "${NORTH_STAR_BLOB}"
          git fetch origin "+refs/heads/builder/multi-source-ideation-intake-20261021:refs/remotes/origin/builder/multi-source-ideation-intake-20261021"
          git cat-file -e "${MULTISOURCE_MERGED_HEAD}^{commit}"
          git cat-file -e "${MULTISOURCE_QUALIFICATION_HEAD}^{commit}"
          test "$(git merge-base "${WAVE2_IMMUTABLE_BASE_SHA}" "${MULTISOURCE_MERGED_HEAD}")" = "${WAVE2_IMMUTABLE_BASE_SHA}"
          test "$(git merge-base "${WAVE2_IMMUTABLE_BASE_SHA}" "${MULTISOURCE_QUALIFICATION_HEAD}")" = "${WAVE2_IMMUTABLE_BASE_SHA}"
          git merge-base --is-ancestor "${MULTISOURCE_MERGED_HEAD}" "${MULTISOURCE_QUALIFICATION_HEAD}"
          echo "OBSERVED_MULTISOURCE_HEAD=$(git rev-parse refs/remotes/origin/builder/multi-source-ideation-intake-20261021)" | tee /tmp/ms-c2.env
          echo "MERGED_MULTISOURCE_HEAD=${MULTISOURCE_MERGED_HEAD}" | tee -a /tmp/ms-c2.env
          echo "QUALIFICATION_MULTISOURCE_HEAD=${MULTISOURCE_QUALIFICATION_HEAD}" | tee -a /tmp/ms-c2.env

      - name: Prove qualification delta after merged snapshot is test-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${MULTISOURCE_MERGED_HEAD}" "${MULTISOURCE_QUALIFICATION_HEAD}" > /tmp/ms-post-merge.paths
          test -s /tmp/ms-post-merge.paths
          if grep -Ev '^tests/test_multi_source_ideation_v2_.*\.py$' /tmp/ms-post-merge.paths; then
            echo 'NON_TEST_DELTA_AFTER_MERGED_MULTISOURCE_HEAD=TRUE' >&2
            exit 1
          fi
          late_count=$(wc -l < /tmp/ms-post-merge.paths | tr -d ' ')
          test "$late_count" -gt 0
          echo "MULTISOURCE_LATE_TEST_ONLY_FILES=${late_count}" | tee -a /tmp/ms-c2.env

      - name: Prove exact Multi-Source semantic port
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            research/research_os/MULTISOURCE_IDEATION_V2_BASE_20261021.md
            research/research_os/MULTISOURCE_IDEATION_V2_CONTRACT_20261021.md
            research/research_os/MULTISOURCE_IDEATION_V2_MANIFEST_20261021.md
            research/research_os/ideation_cycle.py
            research/research_os/multi_source_ideation.py
            research/research_os/multi_source_ideation_bindings.py
            research/research_os/multi_source_ideation_hardening.py
            research/research_os/policy_c_safe.py
            research/research_os/tests/test_multi_source_ideation_v2.py
            tests/test_multi_source_ideation_v2.py
          )
          for path in "${paths[@]}"; do
            test "$(git rev-parse "HEAD:${path}")" = "$(git rev-parse "${MULTISOURCE_QUALIFICATION_HEAD}:${path}")"
          done
          grep -F 'PENDING_EXACT_HEAD_CI' research/research_os/MULTISOURCE_IDEATION_V2_MANIFEST_20261021.md
          grep -F 'WAVE2_INTEGRATED=false' research/research_os/MULTISOURCE_IDEATION_V2_MANIFEST_20261021.md
          grep -F 'Policy C is advisory only' research/research_os/MULTISOURCE_IDEATION_V2_CONTRACT_20261021.md
          echo 'MULTISOURCE_SEMANTIC_PORT_EXACT=TRUE' | tee -a /tmp/ms-c2.env
          echo 'SOURCE_MANIFEST_NOT_PROMOTED_TO_FINAL=TRUE' | tee -a /tmp/ms-c2.env

      - name: Preserve exact sealed-base repair blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/research_os/legacy/LEGACY_RESEARCH_LEDGER.imported.json)" = ba9b165aaf96956776672df51233bb9bf1e6cbc9
          test "$(git hash-object research/research_os/tests/test_economic_identity_portfolio_readiness.py)" = 4c163e5c1276e4909b4be3e97990e899c9079234
          test "$(git hash-object research/research_os/tests/test_economic_readiness_integration.py)" = 8b64c95695abfc661e636b20deb20713d391d5e5
          echo 'SEALED_BASE_REPAIR_PRESERVED=TRUE' | tee -a /tmp/ms-c2.env

      - name: Compile canonical Multi-Source implementation
        run: |
          python3 -m py_compile \
            research/research_os/ideation_cycle.py \
            research/research_os/multi_source_ideation.py \
            research/research_os/multi_source_ideation_bindings.py \
            research/research_os/multi_source_ideation_hardening.py \
            research/research_os/policy_c_safe.py \
            research/research_os/tests/test_multi_source_ideation_v2.py

      - name: Run merged canonical Multi-Source suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v research.research_os.tests.test_multi_source_ideation_v2
          python3 -m unittest discover -s tests -p 'test_multi_source_ideation_v2*.py' -v 2>&1 | tee /tmp/ms-merged.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/ms-merged.log').read_text()
          counts=re.findall(r'^Ran ([0-9]+) tests', text, flags=re.MULTILINE)
          assert counts, text[-2000:]
          n=int(counts[-1]); assert n > 20, n
          Path('/tmp/ms-merged.count').write_text(str(n))
          print(f'MULTISOURCE_MERGED_TESTS={n}_PASS')
          PY

      - name: Extract and run every adversarial test from later pinned qualification snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ms-adversarial
          mkdir -p /tmp/ms-adversarial
          git ls-tree -r --name-only "${MULTISOURCE_QUALIFICATION_HEAD}" tests \
            | grep '^tests/test_multi_source_ideation_v2_.*\.py$' \
            | sort > /tmp/ms-adversarial.paths
          count=$(wc -l < /tmp/ms-adversarial.paths | tr -d ' ')
          test "$count" -gt 20
          while IFS= read -r src; do
            dst="/tmp/ms-adversarial/$(basename "$src")"
            git show "${MULTISOURCE_QUALIFICATION_HEAD}:${src}" > "$dst"
            test "$(git hash-object "$dst")" = "$(git rev-parse "${MULTISOURCE_QUALIFICATION_HEAD}:${src}")"
          done < /tmp/ms-adversarial.paths
          echo "MULTISOURCE_ADVERSARIAL_FILES=${count}" | tee -a /tmp/ms-c2.env
          python3 -m unittest discover -s /tmp/ms-adversarial -p 'test_multi_source_ideation_v2_*.py' -v 2>&1 | tee /tmp/ms-adversarial.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/ms-adversarial.log').read_text()
          counts = re.findall(r'^Ran ([0-9]+) tests', text, flags=re.MULTILINE)
          assert counts, text[-2000:]
          n = int(counts[-1]); assert n > 20, n
          Path('/tmp/ms-adversarial.count').write_text(str(n))
          print(f'MULTISOURCE_PINNED_ADVERSARIAL_TESTS={n}_PASS')
          PY

      - name: Prove Multi-Source cannot bypass Research Intelligence into B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from research.research_os.multi_source_ideation import BASE_SHA, side_effect_zeroes
          from research.research_os.multi_source_ideation_hardening import qualify_for_discovery
          from research.research_os.discovery_chain import run_discovery_chain

          assert BASE_SHA == '2b99d8aeb8a342f1ef32544247d366cb8a26037e'
          proposal = {
              'artifact_kind': 'IDEA_PROPOSAL',
              'context_snapshot_hash': 'ctx-wave2-c2-msb',
              'payload': {
                  'mechanism': 'bounded mechanism', 'payer': 'payer', 'actor': 'actor',
                  'clock': 'clock', 'universe': 'universe', 'falsifier': 'falsifier',
              },
          }
          disposition = qualify_for_discovery(
              proposal=proposal,
              context_snapshot_hash='ctx-wave2-c2-msb',
              memory={'classification': 'NO_QUALIFIED_MATCH'},
              duplicate={'classification': 'DISTINCT'},
              implementability={'admissible': True},
          )
          assert disposition == {
              'decision': 'ELIGIBLE_FOR_DISCOVERY',
              'eligible_for_discovery': True,
              'boundary': 'ELIGIBLE_FOR_DISCOVERY',
              'ready_task_created': False,
              'candidate_created': False,
          }, disposition
          assert all(value == 0 for value in side_effect_zeroes().values()), side_effect_zeroes()
          bypass = run_discovery_chain(
              {**disposition, 'proposal': proposal},
              engine_key='quant', source={}, run_id='WAVE2-C2-MS-B-BYPASS',
              synthetic_only=True, discovery_facts={},
          )
          assert bypass['status'] == 'BLOCKED_BEFORE_PRODUCER', bypass
          assert bypass['producer_executed'] is False, bypass
          assert bypass['blockers'] == ['RESEARCH_INTELLIGENCE_NOT_QUALIFIED_FOR_PRODUCER'], bypass
          assert bypass['scheduler_mutation'] is False
          assert bypass['control_plane_mutation'] is False
          assert bypass['scientific_memory_mutation'] is False
          assert bypass['outcome_accessed'] is False
          assert all(value is False for value in bypass['authority'].values())
          print('MULTISOURCE_BOUNDARY=ELIGIBLE_FOR_DISCOVERY_ONLY')
          print('DIRECT_MULTISOURCE_TO_B_BYPASS=BLOCKED')
          print('RESEARCH_INTELLIGENCE_REMAINS_REQUIRED=TRUE')
          print('READY_TASK_CREATED=FALSE')
          print('CANDIDATE_CREATED_BY_MULTISOURCE=FALSE')
          print('OUTCOME_ACCESSED=FALSE')
          PY

      - name: Regress qualified MEGA B discovery contracts
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q \
            research/research_os/tests/test_mega_b_all_producer_routes.py \
            research/research_os/tests/test_mega_b_canonical_gate.py \
            research/research_os/tests/test_mega_b_discovery_chain.py \
            research/research_os/tests/test_mega_b_discovery_engine.py \
            research/research_os/tests/test_mega_b_outcome_firewall.py

      - name: Regress C0 scientific adjudication and C0 to D0 seam
        run: |
          python3 -m unittest discover -s tests -p 'test_wave2_c2_scientific_adjudication.py' -v
          python3 -m unittest discover -s tests -p 'test_wave2_c2_scientific_economic_d0_seam.py' -v

      - name: Regress D0 economic lifecycle
        run: python3 -m unittest discover -s tests -p 'test_mega_d0_economic_lifecycle.py' -v

      - name: Regress E runtime recovery and Oracle composition
        run: |
          python3 -m unittest -v \
            research.research_os.tests.test_mega_e_live_receipt_reconciliation \
            tests.test_oracle_live_projection \
            tests.test_oracle_live_composition \
            tests.test_research_os_v2_core \
            tests.test_research_os_v2_worker_integration \
            research.research_os.tests.test_queue_replenisher \
            research.research_os.tests.test_oracle_worker

      - name: Regress W1 Factory and W1 Economic law
        run: |
          python3 -m unittest -v \
            research.research_os.tests.test_w1_factory_experiment_infrastructure \
            research.research_os.tests.test_w1_factory_experiment_bridge \
            research.research_os.tests.test_w1_factory_economic_integration \
            research.research_os.tests.test_w1_factory_firewall_hardening \
            research.research_os.tests.test_economic_identity_memory_context_w1 \
            research.research_os.tests.test_economic_identity_portfolio_depth_w1 \
            research.research_os.tests.test_economic_identity_portfolio_frontier_w1 \
            research.research_os.tests.test_economic_identity_portfolio_readiness \
            research.research_os.tests.test_economic_readiness_integration \
            research.research_os.tests.test_economic_readiness_validation

      - name: Prove cumulative authority and outcome membranes remain closed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from research.research_os.multi_source_ideation import BASE_SHA, side_effect_zeroes
          from research.research_os.discovery_engine import AUTHORITY as B_AUTHORITY
          from research.research_os.expansion.economic_lifecycle import AUTHORITY_STATE as D0_AUTHORITY
          from research.research_os.expansion.scientific_adjudication import AUTHORITY_STATE as C0_AUTHORITY
          from research.research_os.control_plane import load_control_plane

          assert BASE_SHA == '2b99d8aeb8a342f1ef32544247d366cb8a26037e'
          assert all(value == 0 for value in side_effect_zeroes().values())
          assert all(value is False for value in B_AUTHORITY.values()), B_AUTHORITY
          assert all(value is False for value in D0_AUTHORITY.values()), D0_AUTHORITY
          assert all(value is False for value in C0_AUTHORITY.values()), C0_AUTHORITY
          control = load_control_plane(Path('research/research_os'))
          assert control['status'] == 'PASS', control['errors']
          refill = control['queue_replenishment']
          for key in ('economic_experiment_authorized','prospective_observation_authorized','real_capital_authorized','live_trading_authorized'):
              assert refill[key] is False, (key, refill)
          policy = json.loads(Path('research/research_os/runtime/V2_CORE_POLICY.json').read_text())
          assert all(value is False for value in policy['authority'].values()), policy['authority']
          membrane = policy['evaluation_membrane']
          assert membrane['status'] == 'SEALED'
          assert membrane['research_outcome_read_capability'] is False
          assert membrane['research_supervisor_outcome_read_capability'] is False
          assert membrane['evaluation_research_write_capability'] is False
          print('MULTISOURCE_AUTHORITY_OPENED=FALSE')
          print('CUMULATIVE_AUTHORITY_OPENED=FALSE')
          print('OUTCOME_ACCESSED=FALSE')
          PY

      - name: Live Lab factual projection contracts
        run: |
          python3 -m unittest research.research_os.tests.test_live_lab_contract -v
          node --test research/live_lab_ux/tests/*.test.js

      - name: Full root regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Full Research OS regression
        run: python3 -m unittest discover -s research/research_os/tests -p 'test_*.py' -v

      - name: V1 end-to-end non-regression
        run: python3 scripts/demo_quant_system.py

      - name: Exact-head clean tree and cumulative receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          env = {}
          for line in Path('/tmp/ms-c2.env').read_text().splitlines():
              if '=' in line:
                  k, v = line.split('=', 1); env[k] = v
          receipt = {
              'mission': 'WAVE2_C2_CANONICAL_INTEGRATION',
              'stage': 'MULTISOURCE_IDEATION_INTAKE_PORT',
              'qualified_head': os.environ['GITHUB_SHA'],
              'wave2_immutable_base_sha': os.environ['WAVE2_IMMUTABLE_BASE_SHA'],
              'multisource_merged_head': os.environ['MULTISOURCE_MERGED_HEAD'],
              'multisource_qualification_head': os.environ['MULTISOURCE_QUALIFICATION_HEAD'],
              'observed_multisource_head_at_run': env.get('OBSERVED_MULTISOURCE_HEAD'),
              'late_test_only_files': int(env['MULTISOURCE_LATE_TEST_ONLY_FILES']),
              'semantic_port_exact': True,
              'source_manifest_promoted_to_final': False,
              'merged_multisource_tests_passed': int(Path('/tmp/ms-merged.count').read_text()),
              'pinned_adversarial_source_test_files': int(env['MULTISOURCE_ADVERSARIAL_FILES']),
              'pinned_adversarial_tests_passed': int(Path('/tmp/ms-adversarial.count').read_text()),
              'direct_multisource_to_b_bypass': 'BLOCKED',
              'research_intelligence_remains_required': True,
              'ready_task_created': False,
              'candidate_created_by_multisource': False,
              'economic_experiment_authorized': False,
              'prospective_observation_authorized': False,
              'real_capital_authorized': False,
              'live_trading_authorized': False,
              'outcome_accessed': False,
              'worktree_clean': True,
          }
          Path('/tmp/wave2-c2-multisource-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wave2-c2-multisource-${{ github.sha }}
          path: /tmp/wave2-c2-multisource-receipt.json
          if-no-files-found: error
