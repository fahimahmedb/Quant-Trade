name: Wave2 C2 Canonical Multi-Source Qualification

on:
  push:
    branches:
      - builder/convergence-wave2-canonical-20261021
  workflow_dispatch:

permissions:
  contents: read

env:
  WAVE2_IMMUTABLE_BASE_SHA: 2b99d8aeb8a342f1ef32544247d366cb8a26037e
  NORTH_STAR_BLOB: a328b4e6d7d71dafd532938888ebf9818b1b610f
  MULTISOURCE_MERGED_HEAD: b5ba754188b9029f8a80ebfeea37c98b6f636869
  MULTISOURCE_PRIOR_TEST_ONLY_HEAD: b344e868096f36e80abc2bec79ee6e5ad8edcdfa
  MULTISOURCE_ACCEPTED_SEMANTIC_HEAD: a905acf1a76eb0759224793d669caa6ea2974903
  MULTISOURCE_LEDGER_SOURCE_HEAD: c9753460eeabfe2315e05a90495f319e57083ea3
  MULTISOURCE_OUTCOME_FIREWALL_REPAIR: 884632a1fc332df8155eaa5e0557521497dc6d4b
  MULTISOURCE_REPAIRED_BLOB: 8d6e5d27386c437e66593a2e533f67a7f45227e5
  MULTISOURCE_IDEATION_CYCLE_BLOB: 09c3886258c9d86fb2e7a9809aae7b9476550ebf
  MULTISOURCE_LEDGER_SOURCE_BLOB: b20b22bc7541797d6c79b1c81073caa979461d3a
  MULTISOURCE_LEDGER_REPAIR_BLOB: b67db15452417e49e50c5ca23c61f3cb70e7c1b8
  MULTISOURCE_LEDGER_TEST_BLOB: e75be3af7f93fe392a39256de38149718404e4d8
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

jobs:
  qualify-multisource:
    name: Canonical passive Multi-Source intake, semantic hardening and cumulative proof
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m pip install --disable-pip-version-check pytest

      - name: Bind exact canonical head and source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$WAVE2_IMMUTABLE_BASE_SHA" HEAD
          git merge-base --is-ancestor "$MULTISOURCE_MERGED_HEAD" HEAD
          git merge-base --is-ancestor "$MULTISOURCE_OUTCOME_FIREWALL_REPAIR" HEAD
          test "$(git rev-parse HEAD:QUANT_NORTH_STAR.md)" = "$NORTH_STAR_BLOB"
          git fetch origin "+refs/heads/builder/multi-source-ideation-intake-20261021:refs/remotes/origin/builder/multi-source-ideation-intake-20261021"
          observed="$(git rev-parse refs/remotes/origin/builder/multi-source-ideation-intake-20261021)"
          git merge-base --is-ancestor "$MULTISOURCE_MERGED_HEAD" "$MULTISOURCE_PRIOR_TEST_ONLY_HEAD"
          git merge-base --is-ancestor "$MULTISOURCE_PRIOR_TEST_ONLY_HEAD" "$MULTISOURCE_ACCEPTED_SEMANTIC_HEAD"
          git merge-base --is-ancestor "$MULTISOURCE_ACCEPTED_SEMANTIC_HEAD" "$MULTISOURCE_LEDGER_SOURCE_HEAD"
          git merge-base --is-ancestor "$MULTISOURCE_LEDGER_SOURCE_HEAD" "$observed"
          echo "OBSERVED_MULTISOURCE_HEAD=$observed" | tee /tmp/ms-c2.env

      - name: Classify source evolution exactly
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$MULTISOURCE_MERGED_HEAD" "$MULTISOURCE_PRIOR_TEST_ONLY_HEAD" > /tmp/ms-pre-semantic.paths
          test -s /tmp/ms-pre-semantic.paths
          if grep -Ev '^tests/test_multi_source_ideation_v2_.*\.py$' /tmp/ms-pre-semantic.paths; then
            echo 'PRE_SEMANTIC_SOURCE_DELTA_NOT_TEST_ONLY=TRUE' >&2
            exit 1
          fi

          printf '%s\n' \
            research/research_os/ideation_cycle.py \
            research/research_os/multi_source_ideation.py | sort > /tmp/ms-expected-semantic.paths
          git diff --name-only "$MULTISOURCE_PRIOR_TEST_ONLY_HEAD" "$MULTISOURCE_ACCEPTED_SEMANTIC_HEAD" | sort > /tmp/ms-actual-semantic.paths
          diff -u /tmp/ms-expected-semantic.paths /tmp/ms-actual-semantic.paths

          cat > /tmp/ms-expected-ledger.paths <<'EOF'
          .github/workflows/multisource-refresh-status.yml
          STATE.md
          research/research_os/multi_source_ideation_hardening.py
          tests/test_multi_source_ideation_v2_ledger_truth_firewall.py
          EOF
          sed -i 's/^          //' /tmp/ms-expected-ledger.paths
          sort -o /tmp/ms-expected-ledger.paths /tmp/ms-expected-ledger.paths
          git diff --name-only "$MULTISOURCE_ACCEPTED_SEMANTIC_HEAD" "$MULTISOURCE_LEDGER_SOURCE_HEAD" | sort > /tmp/ms-actual-ledger.paths
          diff -u /tmp/ms-expected-ledger.paths /tmp/ms-actual-ledger.paths

          git diff --name-only "$MULTISOURCE_LEDGER_SOURCE_HEAD" "$(awk -F= '/OBSERVED_MULTISOURCE_HEAD/{print $2}' /tmp/ms-c2.env)" > /tmp/ms-future.paths
          if test -s /tmp/ms-future.paths && grep -Ev '^tests/test_multi_source_ideation_v2_.*\.py$' /tmp/ms-future.paths; then
            echo 'UNREVIEWED_MULTISOURCE_SEMANTIC_DRIFT_AFTER_LEDGER_HEAD=TRUE' >&2
            exit 1
          fi
          echo "MULTISOURCE_FUTURE_TEST_ONLY_FILES=$(wc -l < /tmp/ms-future.paths | tr -d ' ')" | tee -a /tmp/ms-c2.env

      - name: Prove accepted semantic port and canonical ledger repair
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            research/research_os/MULTISOURCE_IDEATION_V2_BASE_20261021.md
            research/research_os/MULTISOURCE_IDEATION_V2_CONTRACT_20261021.md
            research/research_os/MULTISOURCE_IDEATION_V2_MANIFEST_20261021.md
            research/research_os/ideation_cycle.py
            research/research_os/multi_source_ideation.py
            research/research_os/multi_source_ideation_bindings.py
            research/research_os/policy_c_safe.py
            research/research_os/tests/test_multi_source_ideation_v2.py
            tests/test_multi_source_ideation_v2.py
          )
          for path in "${paths[@]}"; do
            test "$(git rev-parse "HEAD:${path}")" = "$(git rev-parse "${MULTISOURCE_ACCEPTED_SEMANTIC_HEAD}:${path}")"
          done
          test "$(git hash-object research/research_os/multi_source_ideation.py)" = "$MULTISOURCE_REPAIRED_BLOB"
          test "$(git hash-object research/research_os/ideation_cycle.py)" = "$MULTISOURCE_IDEATION_CYCLE_BLOB"
          test "$(git rev-parse "$MULTISOURCE_LEDGER_SOURCE_HEAD:research/research_os/multi_source_ideation_hardening.py")" = "$MULTISOURCE_LEDGER_SOURCE_BLOB"
          test "$(git rev-parse "$MULTISOURCE_LEDGER_SOURCE_HEAD:tests/test_multi_source_ideation_v2_ledger_truth_firewall.py")" = "$MULTISOURCE_LEDGER_TEST_BLOB"
          git show "$MULTISOURCE_LEDGER_SOURCE_HEAD:research/research_os/multi_source_ideation_hardening.py" \
            | sed 's/from \.multi_source_ideation import OUTCOME_KEYS, POLICIES, _reject_outcome_fields/from .multi_source_ideation import OUTCOME_BEARING_KEYS, POLICIES, _reject_outcome_fields/' \
            > /tmp/ms-ledger-source-repaired.py
          test "$(git hash-object /tmp/ms-ledger-source-repaired.py)" = "$MULTISOURCE_LEDGER_REPAIR_BLOB"
          test "$(git hash-object research/research_os/multi_source_ideation_hardening.py)" = "$MULTISOURCE_LEDGER_REPAIR_BLOB"
          cmp /tmp/ms-ledger-source-repaired.py research/research_os/multi_source_ideation_hardening.py
          test "$(git hash-object tests/test_multi_source_ideation_v2_ledger_truth_firewall.py)" = "$MULTISOURCE_LEDGER_TEST_BLOB"
          grep -F 'PENDING_EXACT_HEAD_CI' research/research_os/MULTISOURCE_IDEATION_V2_MANIFEST_20261021.md
          grep -F 'not authorized to emit `WAVE2_INTEGRATED_SHA`' research/research_os/MULTISOURCE_IDEATION_V2_MANIFEST_20261021.md
          grep -F 'The backend is not truth, scheduler, Control Plane or scientific evidence.' research/research_os/MULTISOURCE_IDEATION_V2_CONTRACT_20261021.md

      - name: Compile Multi-Source surfaces
        run: |
          python3 -m py_compile \
            research/research_os/ideation_cycle.py \
            research/research_os/multi_source_ideation.py \
            research/research_os/multi_source_ideation_bindings.py \
            research/research_os/multi_source_ideation_hardening.py \
            research/research_os/policy_c_safe.py

      - name: Prove ledger truth firewall and proposal identity remain pre-outcome
        run: |
          python3 -m unittest -v tests.test_multi_source_ideation_v2_ledger_truth_firewall
          python3 - <<'PY'
          from research.research_os.multi_source_ideation_hardening import DurableProposalLedger, proposal_identity

          def must_fail(fn, needle):
              try: fn()
              except ValueError as exc:
                  assert needle in str(exc), (needle, str(exc))
              else:
                  raise AssertionError(f'expected ValueError containing {needle}')

          ledger=DurableProposalLedger()
          ledger.persist({'proposal_id':'sentinel','outcome_accessed':False,'scientific_verdict':'NOT_PERFORMED','economic_result':'NOT_OBSERVED'})
          must_fail(lambda: ledger.persist({'proposal_id':'pnl','nested':{'pnl':1.0}}),'outcome-bearing')
          must_fail(lambda: ledger.persist({'proposal_id':'lease','nested':{'lease_owner':'worker'}}),'operational work semantics')
          must_fail(lambda: proposal_identity(policy_kind='SYSTEMATIC_COVERAGE',context_snapshot_hash='ctx',payload={'nested':{'pnl':1}},provenance={'source':'x'}),'outcome-bearing')
          must_fail(lambda: proposal_identity(policy_kind='SYSTEMATIC_COVERAGE',context_snapshot_hash='ctx',payload={'mechanism':'m'},provenance={'nested':{'returns':[1]}}),'outcome-bearing')
          print('MULTISOURCE_LEDGER_TRUTH_FIREWALL=PASS')
          PY

      - name: Prove frozen-context receipt and passive-disposition hardening
        run: |
          python3 - <<'PY'
          from research.research_os.multi_source_ideation import build_context_snapshot, raw_artifact
          from research.research_os.ideation_cycle import raw_proposal_receipt, ideation_cycle, proposal_disposition

          refs={k:k+':v1' for k in (
              'memory_snapshot_ref','ancestry_snapshot_ref','frontier_snapshot_ref','evidence_snapshot_ref',
              'source_catalog_snapshot_ref','capability_snapshot_ref','authority_snapshot_ref','active_work_snapshot_ref')}
          s=build_context_snapshot(ideation_cycle_id='cycle-hard',created_at='2026-10-21T20:00:00Z',refs=refs,relevant_schema_versions={'memory':'v1'})
          h=s['context_snapshot_hash']
          arts=[
              raw_artifact(policy_kind='SYSTEMATIC_COVERAGE',status='NO_PROPOSAL',context_snapshot_hash=h),
              raw_artifact(policy_kind='INFORMATION_VALUE',status='NO_ACTION',context_snapshot_hash=h),
              raw_artifact(policy_kind='DIVERGENT_EXPLORATION',status='SOURCE_UNAVAILABLE',context_snapshot_hash=h),
          ]
          receipts=[raw_proposal_receipt(cycle_id='cycle-hard',artifact=a,provenance={'source':'bounded'}) for a in arts]
          out=ideation_cycle(cycle_id='cycle-hard',context_snapshot=s,artifacts=arts,receipts=receipts)
          assert out['intake_allowed'] is True and out['outcome_accessed'] is False

          def must_fail(fn, needle):
              try: fn()
              except ValueError as exc:
                  assert needle in str(exc), (needle,str(exc))
              else: raise AssertionError(f'expected ValueError containing {needle}')

          must_fail(lambda: ideation_cycle(cycle_id='wrong',context_snapshot=s,artifacts=arts,receipts=receipts),'cycle id')
          bad=[dict(x) for x in receipts]; bad[0]['artifact_hash']='0'*64
          must_fail(lambda: ideation_cycle(cycle_id='cycle-hard',context_snapshot=s,artifacts=arts,receipts=bad),'artifact hash')
          must_fail(lambda: raw_proposal_receipt(cycle_id='cycle-hard',artifact=arts[0],provenance={'nested':{'pnl':1}}),'outcome-bearing')
          must_fail(lambda: proposal_disposition(proposal_id='p',intake_decision={'decision':'NOT_ELIGIBLE','eligible_for_discovery':True},lineage={},duplicate={},implementability={}),'contradictory eligibility')
          must_fail(lambda: proposal_disposition(proposal_id='p',intake_decision={'decision':'ELIGIBLE_FOR_DISCOVERY','eligible_for_discovery':True},lineage={'nested':{'returns':[1]}},duplicate={},implementability={}),'outcome-bearing')
          good=proposal_disposition(proposal_id='p',intake_decision={'decision':'ELIGIBLE_FOR_DISCOVERY','eligible_for_discovery':True},lineage={'classification':'NO_QUALIFIED_MATCH'},duplicate={'classification':'DISTINCT'},implementability={'admissible':True})
          assert good['eligible_for_discovery'] is True and good['operational_admission'] is False and good['outcome_accessed'] is False
          print('MULTISOURCE_FROZEN_CONTEXT_AND_DISPOSITION_HARDENING=PASS')
          PY

      - name: Run all current official and canonical Multi-Source tests
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/ms-c2.env
          rm -rf /tmp/ms-adversarial && mkdir -p /tmp/ms-adversarial
          git ls-tree -r --name-only "$OBSERVED_MULTISOURCE_HEAD" tests | grep '^tests/test_multi_source_ideation_v2_.*\.py$' | sort > /tmp/ms-adversarial.paths
          count=$(wc -l < /tmp/ms-adversarial.paths | tr -d ' '); test "$count" -gt 20
          while IFS= read -r src; do
            dst="/tmp/ms-adversarial/$(basename "$src")"
            git show "$OBSERVED_MULTISOURCE_HEAD:$src" > "$dst"
            test "$(git hash-object "$dst")" = "$(git rev-parse "$OBSERVED_MULTISOURCE_HEAD:$src")"
          done < /tmp/ms-adversarial.paths
          python3 -m unittest discover -s /tmp/ms-adversarial -p 'test_multi_source_ideation_v2_*.py' -v
          python3 -m unittest -v research.research_os.tests.test_multi_source_ideation_v2
          python3 -m unittest discover -s tests -p 'test_multi_source_ideation_v2*.py' -v
          echo "MULTISOURCE_ADVERSARIAL_FILES=$count" | tee -a /tmp/ms-c2.env

      - name: Prove Multi-Source cannot bypass Research Intelligence into B
        run: |
          python3 - <<'PY'
          from research.research_os.multi_source_ideation import side_effect_zeroes
          from research.research_os.multi_source_ideation_hardening import qualify_for_discovery
          from research.research_os.discovery_chain import run_discovery_chain
          p={'artifact_kind':'IDEA_PROPOSAL','context_snapshot_hash':'ctx','payload':{'mechanism':'m','payer':'p','actor':'a','clock':'c','universe':'u','falsifier':'f'}}
          d=qualify_for_discovery(proposal=p,context_snapshot_hash='ctx',memory={'classification':'NO_QUALIFIED_MATCH'},duplicate={'classification':'DISTINCT'},implementability={'admissible':True})
          assert d['eligible_for_discovery'] is True and d['ready_task_created'] is False and d['candidate_created'] is False
          assert all(v==0 for v in side_effect_zeroes().values())
          r=run_discovery_chain({**d,'proposal':p},engine_key='quant',source={},run_id='MS-HARDENED-BYPASS',synthetic_only=True,discovery_facts={})
          assert r['status']=='BLOCKED_BEFORE_PRODUCER' and r['blockers']==['RESEARCH_INTELLIGENCE_NOT_QUALIFIED_FOR_PRODUCER']
          assert r['producer_executed'] is False and r['outcome_accessed'] is False and all(v is False for v in r['authority'].values())
          PY

      - name: Cumulative B C0 seam D0 E W1 regression
        run: |
          python3 -m pytest -q \
            research/research_os/tests/test_mega_b_all_producer_routes.py \
            research/research_os/tests/test_mega_b_canonical_gate.py \
            research/research_os/tests/test_mega_b_discovery_chain.py \
            research/research_os/tests/test_mega_b_discovery_engine.py \
            research/research_os/tests/test_mega_b_outcome_firewall.py
          python3 -m unittest discover -s tests -p 'test_wave2_c2_scientific_adjudication.py' -v
          python3 -m unittest discover -s tests -p 'test_wave2_c2_scientific_economic_d0_seam.py' -v
          python3 -m unittest discover -s tests -p 'test_mega_d0_economic_lifecycle.py' -v
          python3 -m unittest -v \
            research.research_os.tests.test_mega_e_live_receipt_reconciliation \
            tests.test_oracle_live_projection tests.test_oracle_live_composition \
            tests.test_research_os_v2_core tests.test_research_os_v2_worker_integration \
            research.research_os.tests.test_queue_replenisher research.research_os.tests.test_oracle_worker \
            research.research_os.tests.test_w1_factory_experiment_infrastructure \
            research.research_os.tests.test_w1_factory_experiment_bridge \
            research.research_os.tests.test_w1_factory_economic_integration \
            research.research_os.tests.test_w1_factory_firewall_hardening \
            research.research_os.tests.test_economic_identity_portfolio_readiness \
            research.research_os.tests.test_economic_readiness_integration \
            research.research_os.tests.test_economic_readiness_validation

      - name: Authority, generated artifacts and clean-tree proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from research.research_os.multi_source_ideation import side_effect_zeroes
          from research.research_os.discovery_engine import AUTHORITY as B
          from research.research_os.expansion.scientific_adjudication import AUTHORITY_STATE as C
          from research.research_os.expansion.economic_lifecycle import AUTHORITY_STATE as D
          from research.research_os.control_plane import load_control_plane
          assert all(v==0 for v in side_effect_zeroes().values())
          assert all(v is False for v in B.values()) and all(v is False for v in C.values()) and all(v is False for v in D.values())
          cp=load_control_plane(Path('research/research_os')); assert cp['status']=='PASS',cp['errors']
          for k in ('economic_experiment_authorized','prospective_observation_authorized','real_capital_authorized','live_trading_authorized'):
              assert cp['queue_replenishment'][k] is False
          print('MULTISOURCE_CUMULATIVE_AUTHORITY=PASS')
          PY
          python3 scripts/generate_schemas.py --check
          python3 scripts/status_artifacts.py --check
          test -z "$(git status --porcelain)"

      - name: Emit exact-head Multi-Source receipt
        shell: bash
        run: |
          set -euo pipefail; source /tmp/ms-c2.env
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          env={}
          for line in Path('/tmp/ms-c2.env').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); env[k]=v
          r={
              'mission':'WAVE2_C2_CANONICAL_INTEGRATION',
              'stage':'MULTISOURCE_IDEATION_LEDGER_TRUTH_FIREWALL_REPAIRED',
              'qualified_head':os.environ['GITHUB_SHA'],
              'accepted_semantic_source_head':os.environ['MULTISOURCE_ACCEPTED_SEMANTIC_HEAD'],
              'ledger_source_head':os.environ['MULTISOURCE_LEDGER_SOURCE_HEAD'],
              'ledger_source_blob':os.environ['MULTISOURCE_LEDGER_SOURCE_BLOB'],
              'ledger_canonical_repair_blob':os.environ['MULTISOURCE_LEDGER_REPAIR_BLOB'],
              'observed_source_head':env['OBSERVED_MULTISOURCE_HEAD'],
              'future_source_delta_test_only_files':int(env['MULTISOURCE_FUTURE_TEST_ONLY_FILES']),
              'adversarial_files':int(env['MULTISOURCE_ADVERSARIAL_FILES']),
              'ledger_truth_firewall':'PASS',
              'frozen_context_receipt_binding':'PASS',
              'passive_disposition_consistency':'PASS',
              'direct_multisource_to_b_bypass':'BLOCKED',
              'authority_side_effects_zero':True,
              'outcome_accessed':False,
          }
          Path('/tmp/wave2-c2-multisource-receipt.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-c2-multisource-${{ github.sha }}
          path: |
            /tmp/wave2-c2-multisource-receipt.json
            /tmp/ms-pre-semantic.paths
            /tmp/ms-actual-semantic.paths
            /tmp/ms-expected-ledger.paths
            /tmp/ms-actual-ledger.paths
            /tmp/ms-future.paths
            /tmp/ms-adversarial.paths
          if-no-files-found: error
