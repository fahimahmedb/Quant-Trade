name: SEC Form-4 census proof

on:
  push:
    branches: [builder/sec-form4-census-v2a]
    paths: [.github/workflows/sec-form4-census-proof.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  takeover-owner-unresolved-hotfix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: builder/sec-form4-census-v2a
      - name: Apply missing-owner raw-row poison invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/quant/dataplane/sec_form4.py');s=p.read_text()
          if 'self.unkeyed_data:' not in s:
              s=s.replace('        self.unkeyed_rows = 0\n', '        self.unkeyed_rows = 0\n        self.unkeyed_data: list[dict[str, str]] = []\n')
              s=s.replace('            self.unkeyed_rows += 1\n            return\n', '            self.unkeyed_rows += 1\n            self.unkeyed_data.append(row)\n            return\n')
          if 'owner_unkeyed_counts:' not in s:
              s=s.replace('    owner_conflict_accessions: set[str] = set()\n    owner_orphans = 0\n', "    owner_conflict_accessions: set[str] = set()\n    owner_unkeyed_counts: Counter[str] = Counter(\n        _clean(row.get('ACCESSION_NUMBER')) for row in owner_idx.unkeyed_data\n        if _clean(row.get('ACCESSION_NUMBER'))\n    )\n    owner_orphans = 0\n")
          s=s.replace('        unresolved_owner_rows = sum(x is None for x in normalized_owner_ids)\n', '        unresolved_owner_rows = sum(x is None for x in normalized_owner_ids) + owner_unkeyed_counts.get(acc, 0)\n')
          s=s.replace('reporting_owner_rows=len(owners), unresolved_owner_cik_rows=unresolved_owner_rows,', 'reporting_owner_rows=len(owners) + owner_unkeyed_counts.get(acc, 0), unresolved_owner_cik_rows=unresolved_owner_rows,')
          p.write_text(s)
          t=Path('tests/test_sec_form4_census.py');q=t.read_text()
          if 'test_valid_owner_plus_missing_owner_cik_is_unresolved' not in q:
              needle=' def test_joint_filing_ambiguous_excluded(self):\n'
              add=" def test_valid_owner_plus_missing_owner_cik_is_unresolved(self):\n  a='0000000001-24-000001';build=self.build([submission(a)],[owner(a,'101'),owner(a,'')],[tx(a,1)]);self.assertFalse(build.observations);self.assertEqual(1,build.normalized_candidates[0].unresolved_owner_cik_rows)\n"
              q=q.replace(needle,add+needle);t.write_text(q)
          PY
          PYTHONPATH=src python3 -m unittest tests.test_sec_form4_census -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/quant/dataplane/sec_form4.py tests/test_sec_form4_census.py
          git diff --cached --check
          git commit -m 'fix: poison filings with unresolved reporting-owner identity'
          git push origin HEAD:builder/sec-form4-census-v2a

  takeover-unit-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'exchange-calendars==4.13.1'
      - run: |
          python3 scripts/status_artifacts.py --write
          python3 scripts/status_artifacts.py --check
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 scripts/demo_quant_system.py
          python3 scripts/generate_schemas.py --check
          git diff --check 37f298423ca4a100c1c633da2c3c6c2641d8dd8e...HEAD
