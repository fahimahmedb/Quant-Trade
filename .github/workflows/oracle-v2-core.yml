name: Oracle V2 Core

on:
  push:
    branches:
      - builder/oracle-v2-core-20261020
      - builder/v2-forward-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile V2 Core
        run: |
          python -m py_compile \
            research/research_os/expansion/v2_core.py \
            research/research_os/expansion/v2_bridge.py \
            research/research_os/expansion/v2_pipeline.py \
            research/research_os/expansion/v2_stage_executor.py \
            research/research_os/expansion/v2_state.py \
            research/research_os/expansion/v2_independence.py \
            research/research_os/expansion/edge_observability_v2.py \
            research/research_os/expansion/edge_observation_reader_v2.py \
            research/research_os/expansion/evidence_acquisition_intents_v2.py \
            research/research_os/frontier_source_planner_v2.py \
            research/research_os/queue_replenisher.py \
            research/research_os/oracle_worker_v2.py \
            scripts/qualify_oracle_v2_core.py
          python -m py_compile scripts/prove_oracle_v2_dry_run.py
          python -m py_compile scripts/observe_edge_task_v2.py
          python -m py_compile deploy/oracle_v2_deploy.py deploy/oracle_v2_canary.py deploy/oracle_v2_host_prepare.py
          python -m py_compile deploy/oracle_v2_control_path_repair.py
          python -m py_compile deploy/oracle_live_projection.py deploy/oracle_live_host_prepare.py

      - name: V2 Core contract, bridge, worker and whole-loop tests
        run: |
          PYTHONPATH=src python -m unittest -v \
            tests.test_evidence_identity \
            tests.test_data_source_admission \
            tests.test_research_os_raw_evidence_capture \
            tests.test_research_os_historical_source_recovery \
            tests.test_research_os_v2_core \
            tests.test_research_os_canonical_identity \
            tests.test_research_os_epoch_blinding_admission \
            tests.test_research_os_feedback_authorization \
            tests.test_research_os_scientific_claim_admission \
            tests.test_research_os_evaluation_membrane_admission \
            tests.test_research_os_frozen_export_identity \
            tests.test_research_os_structural_unknown_evidence \
            tests.test_research_os_documentary_portfolio_scope \
            research.research_os.tests.test_economic_identity_portfolio_readiness \
            tests.test_research_os_v2_bridge \
            tests.test_research_os_independent_candidate_reconstruction \
            tests.test_research_os_native_trial_lineage \
            tests.test_research_os_canonical_freeze_v2_binding \
            tests.test_research_os_v2_pipeline \
            tests.test_research_os_v2_worker_integration \
            tests.test_research_os_implementability_contract \
            tests.test_research_os_readiness_declarations \
            tests.test_research_os_readiness_provenance_admission \
            tests.test_research_os_frozen_readiness_inputs \
            tests.test_research_os_fundamental_readiness \
            tests.test_research_os_source_pit_clocks \
            tests.test_research_os_frozen_trial_accounting \
            tests.test_research_os_frozen_receipt_binding \
            tests.test_research_os_frozen_envelope_binding \
            research.research_os.tests.test_experiment_runner_frozen_protocol \
            research.research_os.tests.test_implementability_depth \
            research.research_os.tests.test_economic_readiness_integration \
            research.research_os.tests.test_economic_readiness_validation \
            research.research_os.tests.test_producer_economic_readiness \
            tests.test_research_os_edge_observability_v2 \
            tests.test_research_os_edge_observation_reader_v2 \
            tests.test_research_os_frontier_source_planner_v2 \
            tests.test_research_os_evidence_acquisition_intents_v2 \
            tests.test_oracle_v2_deploy \
            tests.test_oracle_v2_release_provenance \
            tests.test_oracle_v2_bootstrap_admission \
            tests.test_oracle_live_projection \
            tests.test_oracle_live_composition \
            tests.test_oracle_live_host_prepare

      - name: Qualify composed native Live Lab contracts
        run: |
          python -m unittest research.research_os.tests.test_live_lab_contract
          node --test research/live_lab_ux/tests/*.test.js

      - name: Verify V2 policy remains fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('research/research_os/runtime/V2_CORE_POLICY.json').read_text())
          epoch = json.loads(Path('research/research_os/runtime/V2_ACTIVE_EPOCH.json').read_text())
          authority = policy['authority']
          required = (
              'economic_experiment_authorized',
              'prospective_observation_authorized',
              'real_capital_authorized',
              'live_trading_authorized',
          )
          assert all(authority[k] is False for k in required), authority
          assert policy['evaluation_membrane']['status'] == 'SEALED'
          assert policy['evaluation_membrane']['research_outcome_read_capability'] is False
          assert policy['evaluation_membrane']['research_supervisor_outcome_read_capability'] is False
          assert policy['evaluation_membrane']['evaluation_research_write_capability'] is False
          assert policy['owner_overrides']['p0_d_server_side_branch_protection_required'] is False
          assert policy['owner_overrides']['destructive_git_operations_authorized'] is False
          assert epoch['state'] == 'OPEN'
          assert epoch['owner_outcome_blinding_status'] == 'BLINDED'
          assert epoch['supervisor_outcome_blinding_status'] == 'BLINDED'
          assert epoch['first_evaluation_export_accepted'] is False
          print('V2_POLICY_FAIL_CLOSED=PASS')
          PY

      - name: Verify V2 claim ceiling
        run: |
          python - <<'PY'
          from research.research_os.expansion.v2_core import CLOSED_AUTHORITY, qualify_v2_core
          proof = {
              'authority': CLOSED_AUTHORITY,
              'epoch_contract_qualified': True,
              'ideation_trial_accounting_qualified': True,
              'leakage_classification_qualified': True,
              'candidate_contract_qualified': True,
              'validator_independence_qualified': True,
              'evaluation_membrane_qualified': True,
              'feedback_lineage_qualified': True,
              'priority_policy_qualified': True,
              'negative_memory_qualified': True,
              'multidimensional_status_qualified': True,
              'bounded_orchestration_qualified': True,
          }
          result = qualify_v2_core(proof)
          assert result['status'] == 'AUTONOMOUS_PRE_OUTCOME_RESEARCH_PIPELINE_QUALIFIED'
          assert result['economic_claim_authorized'] is False
          assert result['prospective_observation_authorized'] is False
          assert result['real_capital_authorized'] is False
          assert result['live_trading_authorized'] is False
          print('V2_CLAIM_CEILING=PASS')
          PY

      - name: Generate exact-head V2 qualification receipt
        run: |
          PYTHONPATH=. python scripts/qualify_oracle_v2_core.py \
            --fixture tests/fixtures/oracle_v2_core_fixture.json \
            --sha "${{ github.sha }}" \
            --output /tmp/oracle-v2-core-verification.json

      - name: Real V2 entrypoint against fresh GitHub state with remote writes disabled
        run: |
          python scripts/prove_oracle_v2_dry_run.py \
            --sha "${{ github.sha }}" --scope CI_GITHUB_READ_ONLY \
            --output /tmp/oracle-v2-real-github-dry-run.json

      - name: Upload exact-head V2 qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: oracle-v2-core-verification-${{ github.sha }}
          path: |
            /tmp/oracle-v2-core-verification.json
            /tmp/oracle-v2-real-github-dry-run.json
          if-no-files-found: error
          retention-days: 90
