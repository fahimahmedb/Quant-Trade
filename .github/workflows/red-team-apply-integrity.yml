name: Apply red-team repair
on:
  push:
    branches:
      - reviewer/v1-final-red-team
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/red_team_integrity_patch.py
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: python3 scripts/demo_quant_system.py
      - run: python3 scripts/generate_schemas.py --check
      - run: git diff --check
      - run: |
          git config user.name "V1 Red Team"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent V1 red-team integrity defects"
          git push origin HEAD:reviewer/v1-final-red-team
