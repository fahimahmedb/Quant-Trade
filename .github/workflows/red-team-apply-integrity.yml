name: Apply V1 red-team integrity patch

on:
  push:
    branches: [reviewer/v1-final-red-team]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'red-team: launch integrity patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed patch
        run: python3 scripts/red_team_integrity_patch.py
      - name: Verify full unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Verify demo
        run: python3 scripts/demo_quant_system.py
      - name: Verify schemas
        run: python3 scripts/generate_schemas.py --check
      - name: Verify diff whitespace
        run: git diff --check
      - name: Commit and push
        run: |
          git config user.name "V1 Red Team"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: close independent V1 red-team integrity defects"
          git push origin HEAD:reviewer/v1-final-red-team
