name: Oracle Economic Loop Recovery CI

on:
  push:
    branches:
      - builder/oracle-economic-loop-recovery-20261019
    paths:
      - 'deploy/**'
      - 'tests/test_oracle*.py'
      - 'tests/test_oci*.py'
      - 'research/research_os/**'
      - '.github/workflows/oracle-economic-loop-recovery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp1-static-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Oracle recovery scripts
        run: |
          python -m py_compile \
            deploy/oracle_release_install.py \
            deploy/oci_research_os_deploy.py \
            tests/test_oracle_release_install.py \
            tests/test_oci_research_os_deploy.py \
            research/research_os/worker_preflight.py \
            research/research_os/model_backend.py \
            research/research_os/github_state.py \
            research/research_os/worker_stages.py \
            research/research_os/oracle_worker.py \
            deploy/oracle_model_inventory.py \
            deploy/oracle_h24_canary.py \
            deploy/oracle_scheduler_install.py
          python -m py_compile deploy/oracle_local_backend_install.py
          python -m py_compile deploy/oracle_local_backend_qualify.py

      - name: Run Oracle recovery unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests/test_oracle_release_install.py \
            tests/test_oci_research_os_deploy.py 2>&1 | tee /tmp/quant-oracle-tests.log

      - name: Local backend, fresh Git state, atomic leases and crash recovery (not live OCI evidence)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            research.research_os.tests.test_model_backend \
            research.research_os.tests.test_oracle_worker \
            research.research_os.tests.test_oracle_scheduler \
            tests.test_oracle_local_backend_qualify 2>&1 | tee /tmp/quant-worker-tests.log

      - name: Run pre-outcome Research OS regressions used by installer and worker preflight
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            research.research_os.tests.test_implementability_depth \
            research.research_os.tests.test_experiment_runner_frozen_protocol \
            research.research_os.tests.test_economic_readiness_validation \
            research.research_os.tests.test_economic_identity_portfolio_readiness \
            research.research_os.tests.test_producer_economic_readiness \
            research.research_os.tests.test_economic_readiness_integration \
            research.research_os.tests.test_queue_replenisher \
            research.research_os.tests.test_worker_preflight 2>&1 | tee /tmp/quant-science-tests.log

      - name: Assert scheduler remains absent from CP1 deploy scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              'systemctl enable',
              'systemctl start',
              'systemctl --now',
              'scheduler_started = true',
              'scheduler_started": true',
          )
          for name in ('deploy/oracle_release_install.py', 'deploy/oci_research_os_deploy.py'):
              text = Path(name).read_text().lower()
              hits = [needle for needle in forbidden if needle in text]
              if hits:
                  raise SystemExit(f'{name}: forbidden scheduler activation surface: {hits}')
          print('CP1 scheduler activation surface: absent')
          PY

      - name: Write exact-head CI receipt (never live host proof)
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from research.research_os.worker_preflight import AUTHORITY_KEYS, load_current_hypothesis_corpus

          counts = {}
          for suite, path in [('oracle', '/tmp/quant-oracle-tests.log'), ('worker_backend_scheduler', '/tmp/quant-worker-tests.log'), ('science', '/tmp/quant-science-tests.log')]:
              raw = Path(path).read_text()
              match = re.search(r'Ran (\d+) tests? in ', raw)
              if not match or not re.search(r'^OK$', raw, re.MULTILINE):
                  raise SystemExit('Missing successful test evidence: ' + suite)
              counts[suite] = int(match.group(1))
          authority = json.loads(Path('research/research_os/runtime/CONTROL_PLANE.json').read_text())['global_authority']
          assert all(authority.get(k) is False for k in AUTHORITY_KEYS)
          corpus = load_current_hypothesis_corpus(Path('research/research_os'))
          receipt = {
              'schema_version': 'oracle-h24-exact-head-ci-v1',
              'commit_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'ci_run_id': int(os.environ['GITHUB_RUN_ID']),
              'evidence_scope': 'CI_ONLY_LOCAL_GIT_AND_HTTP_TEST_DOUBLES',
              'status': 'PASS', 'tests_passed': counts, 'total_tests_passed': sum(counts.values()),
              'current_corpus_count': corpus['count'], 'current_corpus_hash': corpus['snapshot_hash'],
              'authority': {k: authority[k] for k in AUTHORITY_KEYS},
              'live_oracle_execution': False, 'live_gpt_oss_execution': False,
              'timer_enabled_by_ci': False, 'oracle_h24_research_lab': 'NOT_PROVEN_BY_CI'
          }
          (Path(os.environ['RUNNER_TEMP']) / 'oracle-h24-ci-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: oracle-h24-ci-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/oracle-h24-ci-receipt.json
          if-no-files-found: error
          retention-days: 30
