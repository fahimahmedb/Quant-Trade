name: Multi-source status refresh

on:
  push:
    branches:
      - builder/multi-source-ideation-intake-20261021
    paths:
      - .github/workflows/multisource-refresh-status.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder/multi-source-ideation-intake-20261021
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical status artifacts
        run: python3 scripts/status_artifacts.py --write
      - name: Commit generated status only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATE.md CHIEF_BRIEF.md
          if git diff --cached --quiet; then
            echo "No status drift to commit"
            exit 0
          fi
          git commit -m "chore(status): refresh canonical proof inventory"
          git push origin HEAD:builder/multi-source-ideation-intake-20261021
