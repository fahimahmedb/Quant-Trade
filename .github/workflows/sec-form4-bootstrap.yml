name: SEC Form-4 V2-A bootstrap

on:
  push:
    branches:
      - builder/sec-form4-census-v2a

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'build: bootstrap materialize SEC Form-4 V2-A' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact Git-transported payload
        run: cat .bootstrap/exact.part* | base64 -d | tar -xzf - -C .

      - name: Install pinned calendar dependency
        run: python -m pip install 'exchange-calendars==4.11.1'

      - name: Validate SEC census implementation
        run: |
          PYTHONPATH=src python3 -m unittest tests.test_sec_form4_census -v
          python3 -m py_compile src/quant/dataplane/sec_form4.py scripts/sec_form4_census.py scripts/sec_form4_proof.py
          python3 scripts/generate_schemas.py --check

      - name: Commit durable implementation and remove transport
        run: |
          git config user.name 'quant-builder-bot'
          git config user.email 'quant-builder-bot@users.noreply.github.com'
          git add -A
          git rm -rf .bootstrap
          git rm .github/workflows/sec-form4-bootstrap.yml
          git commit -m 'build: harden deterministic SEC Form-4 census semantics'
          git push origin HEAD:builder/sec-form4-census-v2a
