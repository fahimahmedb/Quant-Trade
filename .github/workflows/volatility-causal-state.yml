name: Volatility causal state

# Synthetic checks only: no market data, model fits or economic evaluations.
# Keep research dependencies separate from the stdlib-only system gate.
on:
  pull_request:
    paths:
      - 'src/volatility.py'
      - 'research/edge_search/test_volatility_causal_state.py'
      - 'research/edge_search/eurusd_range_grid/*.py'
      - '.github/workflows/volatility-causal-state.yml'
  push:
    branches:
      - 'research/technical-signals-literature-2026-10-10'
    paths:
      - 'src/volatility.py'
      - 'research/edge_search/test_volatility_causal_state.py'
      - 'research/edge_search/eurusd_range_grid/*.py'
      - '.github/workflows/volatility-causal-state.yml'

permissions:
  contents: read

jobs:
  causal-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 arch==8.0.0 pytest==9.1.1
      - name: Test causal prefixes and saved-state restart
        run: python -m pytest -q research/edge_search/test_volatility_causal_state.py
      - name: Challenge FX risk and adverse fills with synthetic quotes
        run: python -m unittest discover -s research/edge_search/eurusd_range_grid -p 'test_*.py' -v
