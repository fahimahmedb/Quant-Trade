name: Red-team peak probe
on:
  push:
    branches: [reviewer/v1-final-red-team]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=src python3 -c "import tempfile; from pathlib import Path; from quant.book.ledger import Ledger; d=tempfile.TemporaryDirectory(); b=Ledger(Path(d.name)/'b.json', initial_capital=100.0); b.apply_fill('AAA',1,10,0,'2025-01-01','S','f'); b.mark_to_market('2025-01-01',{'AAA':30}); b.mark_to_market('2025-01-01',{'AAA':10}); print(b.state.nav_history,b.state.peak_nav,b.drawdown); assert b.state.peak_nav==100.0"
