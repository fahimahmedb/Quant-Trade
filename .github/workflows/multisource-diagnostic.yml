name: Multi-source focused diagnostic

on:
  push:
    branches:
      - builder/multi-source-ideation-intake-20261021
    paths:
      - .github/workflows/multisource-diagnostic.yml

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Multi-Source focused tests and retain log
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_multi_source_ideation_v2*.py' -v 2>&1 | tee /tmp/multisource-focused.log
      - name: Upload focused diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: multisource-focused-log
          path: /tmp/multisource-focused.log
      - name: Preserve failure conclusion
        if: steps.focused.outcome != 'success'
        run: exit 1
