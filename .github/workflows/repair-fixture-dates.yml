name: Repair synthetic fixture dates

on:
  push:
    branches:
      - reviewer/v1-final-red-team

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair fixture
        run: python3 scripts/repair_fixture_dates.py
      - name: Run unit suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Commit repaired fixture and remove one-shot tooling
        run: |
          git config user.name "V1 Red Team"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: use calendar-valid synthetic session dates"
          git push origin HEAD:reviewer/v1-final-red-team
