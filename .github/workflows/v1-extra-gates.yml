name: V1 extra gates
on:
  push:
    branches: [reviewer/v1-final-red-team]
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/demo_quant_system.py
      - run: python3 scripts/generate_schemas.py --check
      - run: git diff --check a5b8e5fc3a1b6aba1b43337a66e0db08822d87f0...HEAD
