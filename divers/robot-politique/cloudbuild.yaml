# Google Cloud Build configuration for automated deployment
steps:
  # Step 1: Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/robot-trader:latest"
      - "-t"
      - "gcr.io/$PROJECT_ID/robot-trader:$COMMIT_SHA"
      - "."

  # Step 2: Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/robot-trader:latest"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gke-deploy"
    args:
      - "run"
      - "--filename=."
      - "--image=gcr.io/$PROJECT_ID/robot-trader:latest"
      - "--location=us-central1"
      - "--output=/workspace/deployment"

  # Step 4: Deploy to Cloud Run using gcloud
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "robot-trader"
      - "--image"
      - "gcr.io/$PROJECT_ID/robot-trader:latest"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/robot-trader:latest"
  - "gcr.io/$PROJECT_ID/robot-trader:$COMMIT_SHA"

options:
  machineType: "N1_HIGHCPU_8"

timeout: "1800s"
